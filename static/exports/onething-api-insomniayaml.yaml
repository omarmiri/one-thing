  _type: request
  _id: req_ad0d657f2e444e01b3e1784087beb4af
  parentId: fld_20c1230518a6468eb80fe87ae3750100
  description: Gemini looks at the shop's photos and says which one shows each colour, so buyers who pick a colour see it. Suggests only; save the matches with `setColorPhotos`. Needs at least two photos.
- name: setColorPhotos
  method: PUT
  url: '{{default}}/api/shops/{slug}/color-photos'
  body:
    mimeType: application/json
    text: '{"photos":{"Cream":"LFRvGuTU3D8i334X","Red":null}}'
  headers:
  - name: Content-Type
    value: application/json
    disabled: false
  - name: x-admin-token
    value: x-admin-token64
