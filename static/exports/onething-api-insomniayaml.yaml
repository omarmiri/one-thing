        "ship_countries": "ship_countries22",
        "delivery": "file",
        "access_url": "access_url29",
        "paypal_email": "paypal_email43",
        "seller_email": "seller_email82",
        "zapier_hook_url": "zapier_hook_url85",
        "in_gallery": false,
        "options": [
          {
            "name": "Size",
            "kind": "size",
            "values": [
              {
                "label": "M",
                "hex": "#14171a",
