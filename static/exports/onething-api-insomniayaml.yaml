- name: createCheckoutOrder
  method: POST
  url: '{{default}}/api/orders'
  body:
    mimeType: application/json
    text: '{"slug":"raptorrush"}'
  headers:
  - name: Content-Type
    value: application/json
    disabled: false
  _type: request
  _id: req_4782fcd801354c858e45b64b3988b546
  parentId: fld_bce9557416e64dafab7b20f1a09d233d
  description: >
    Creates the PayPal order for one unit of a live shop's product. The amount always comes

    from the shop, never from the caller. Pass the returned `id` to the PayPal JS SDK.


    If the shop has buyer `options`, send one value for each. A sold-out combination answers 409.
- name: captureCheckoutOrder
