- name: callMcp
  method: POST
  url: '{{default}}/api/mcp'
  body:
    mimeType: application/json
    text: '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_shops","arguments":{"query":"game"}}}'
  headers:
