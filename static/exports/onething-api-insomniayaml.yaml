  url: '{{default}}/api/orders/{paypalOrderId}/capture'
  _type: request
  _id: req_9a95845778774b739eaae06552004ead
  parentId: fld_b061e735f72847d9825c815b7d338a30
  description: >
    Call after the buyer approves. Records the sale; digital orders get a download link or access code.

    Safe to call repeatedly: before approval it answers 409, so a page can poll it while the PayPal window is open.
- name: verifyAccessCode
  method: POST
  url: '{{default}}/api/access/verify'
