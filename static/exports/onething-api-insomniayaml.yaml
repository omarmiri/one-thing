    value: /new
    disabled: false
  _type: request
  _id: req_211c4edb89fb4d64887923e6992bf49e
  parentId: fld_13ced9df83624617ac2f9c8be8644856
  description: "A link for a browser, not for code: redirects to PayPal's sign-in page. PayPal sends the seller back to `/api/account/paypal/callback`, which signs them in (creating the account the first time), records the PayPal account their sales are paid into, and redirects to `next`."
- name: createShop
  method: POST
  url: '{{default}}/api/shops'
  body:
    mimeType: multipart/form-data
    params:
    - type: text
      name: source
      value: photo
      disabled: false
    - type: file
      name: photo
      value: path/to/file63
      disabled: false
    - type: text
