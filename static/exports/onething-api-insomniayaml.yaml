- name: checkMissingDetails
  method: POST
  url: '{{default}}/api/shops/{slug}/suggest'
  headers:
  - name: x-admin-token
    value: x-admin-token61
    disabled: false
  _type: request
  _id: req_b226ea9239414dd5bc4723b0bce91a15
  parentId: fld_c57a9f6d8db0416a8162ec76c9c230a5
  description: >
    Asks Gemini what buyers will want to choose (sizes, colours) and what they'll ask that the

    listing doesn't say (dimensions, materials). `createShop` already does this once; call it

    again after editing the product. The result is saved as the shop's `suggestions`.


    Nothing changes on the shop page until the seller confirms: save options with `updateShop`

    (`options`), and answer the questions with `updateShop` (`facts`). Not for recommendations.
- name: matchColorPhotos
  method: POST
  url: '{{default}}/api/shops/{slug}/match-photos'
  body:
    mimeType: application/json
    text: >-
      {
        "colors": [
          {
            "label": "Forest green",
            "hex": "#14171a"
          }
        ]
      }
  headers:
  - name: Content-Type
    value: application/json
    disabled: false
  - name: x-admin-token
    value: x-admin-token37
    disabled: false
  _type: request
  _id: req_f531056a1aa94454996cb803b7b1615f
  parentId: fld_c57a9f6d8db0416a8162ec76c9c230a5
  description: Gemini looks at the shop's photos and says which one shows each colour, so buyers who pick a colour see it. Suggests only; save the matches with `setColorPhotos`. Needs at least two photos.
- name: setColorPhotos
  method: PUT
  url: '{{default}}/api/shops/{slug}/color-photos'
  body:
    mimeType: application/json
    text: >-
      {
        "photos": {
          "key1": "photos76"
        }
      }
  headers:
  - name: Content-Type
    value: application/json
    disabled: false
  - name: x-admin-token
    value: x-admin-token81
