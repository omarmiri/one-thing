                - '{"status":"live"}'
                - '{"price":240,"shipping":15,"ship_countries":"US,CA","in_gallery":true}'
                - '{"options":[{"name":"Size","kind":"size","values":[{"label":"7"},{"label":"8"},{"label":"9"}]}],"option_stock":{"7":3,"8":0,"9":6}}'
