  /api/shops/{slug}/orders/{orderId}/refund:
    post:
      tags:
      - Orders
      summary: refundOrder
      description: "Refunds the whole payment through PayPal and marks the order `refunded`. When PayPal only lets the paid account refund it (the money went to a PayPal email the seller typed in, not a connected account), the reply is a 409 with `refundInPayPal: true`. Refund it in your PayPal account, then call this again with `{\"record\": true}`, which only marks it refunded here. Sends the `order.refunded` event to the shop's Zapier hook."
      operationId: refundOrder
      parameters:
      - name: slug
        in: path
        description: The shop's link name (current or former).
        required: true
        schema:
          type: string
          examples:
          - raptorrush
      - name: orderId
        in: path
        description: OneThing's order id (`Order.id`).
        required: true
        schema:
          type: string
          examples:
          - pX4kR9tVb2nQ7sLe
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ApiShopsOrdersRefundRequest'
              - examples:
                - '{}'
                - '{"record":true}'
              contentMediaType: application/json
            examples:
              refund:
                summary: Refund through PayPal
                value: {}
              record:
                summary: Already refunded in PayPal
                value:
                  record: true
        required: false
      responses:
        '200':
          description: Refunded.
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiShopsOrdersRefundResponse'
                - examples:
                  - ok: true
                    refundId: 1JU08902781691411
                contentMediaType: application/json
              example:
                ok: true
                refundId: 1JU08902781691411
        '404':
          description: No such shop or order, or the token doesn't match the shop.
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - examples:
                  - error: Order not found.
                contentMediaType: application/json
              example:
                error: Order not found.
        '409':
          description: Not refundable here; `error` says why.
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiShopsOrdersRefund409Error1'
                - examples:
                  - '{"error":"Only paid orders can be refunded."}'
                  - '{"error":"PayPal only lets the account that was paid refund this. Refund it in your PayPal account (Activity, then this payment, then Refund), then mark it refunded here.","refundInPayPal":true}'
                contentMediaType: application/json
              examples:
