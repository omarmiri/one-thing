components:
  schemas:
    Error:
      title: Error
      required:
      - error
      type: object
      properties:
        error:
          type: string
          description: A sentence you can show to a person.
        field:
          type: string
          description: The form field at fault, when there is one.
        detail:
          type: string
          description: The upstream service's own message, for debugging.
    CreateShopForm:
      title: CreateShopForm
      required:
      - source
      type: object
      properties:
        source:
          $ref: '#/components/schemas/Source'
        photo:
          type: string
          description: '`source=photo`: the product photo, up to 8 MB.'
          contentEncoding: base64
        description:
          type: string
          description: '`source=photo`: a sentence or two about the product. Required if there is no photo.'
        url:
          type: string
          description: '`source=link`: a product page, or your own app or game page.'
          contentEncoding: uri
        productId:
          type: string
          description: '`source=channel3`: a product id from `searchProducts`.'
        slug:
          type: string
          description: The link name you want. If omitted, the AI suggests one.
        type:
          $ref: '#/components/schemas/Type'
        delivery:
          allOf:
          - $ref: '#/components/schemas/Delivery'
          - description: For digital products. If omitted, the AI guesses.
        access_url:
          type: string
          description: Where buyers use an access code.
          contentEncoding: uri
        price:
          type: number
          description: USD. If omitted, the AI suggests a price.
        shipping:
          type: number
        stock:
          type: integer
          contentEncoding: int32
        ship_countries:
          type: string
          examples:
          - US
          - CA
        paypal_email:
          type: string
          contentEncoding: email
        seller_email:
          type: string
          contentEncoding: email
        digital_file:
          type: string
          contentEncoding: base64
    CreatedShop:
      title: CreatedShop
      required:
      - slug
      - token
      - manageUrl
      type: object
      properties:
        slug:
          type: string
          examples:
          - dragonflight
        token:
          type: string
          description: The admin token. Shown once; store it.
        manageUrl:
          type: string
          description: The seller's private manage page (contains the token).
    ShopUpdate:
      title: ShopUpdate
      type: object
      properties:
        slug:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        product_type:
          allOf:
          - $ref: '#/components/schemas/ProductType'
          - description: '`referral` only for shops created from Channel3.'
        price:
          maximum: 10000
          minimum: 0.5
          type: number
        shipping:
          maximum: 500
          minimum: 0
          type: number
        stock:
          minimum: 0
          type:
          - integer
          - 'null'
          contentEncoding: int32
        ship_countries:
          type:
          - string
          - 'null'
        delivery:
          $ref: '#/components/schemas/Delivery1'
        access_url:
          type:
          - string
          - 'null'
          contentEncoding: uri
        paypal_email:
          type:
          - string
          - 'null'
          contentEncoding: email
        seller_email:
          type:
          - string
          - 'null'
          contentEncoding: email
        zapier_hook_url:
          type:
          - string
          - 'null'
          contentEncoding: uri
        in_gallery:
          type: boolean
          description: Feature the shop at `/gallery` while it's live. Off by default.
        options:
          maxItems: 3
          type: array
          items:
            $ref: '#/components/schemas/ShopOption'
          description: What the buyer picks (physical products only), replacing the current options; `[]` removes them. With options, stock is counted per combination in `option_stock` and the shop's own `stock` is cleared. At most 60 combinations.
        option_stock:
          minimum: 0
          type: object
          additionalProperties:
            type: integer
            format: int32
            nullable: true
          description: Stock per combination, keyed by its values in option order joined with ` / ` (e.g. `M / Black`). A missing key or `null` means unlimited; `0` is sold out.
          examples:
          - M / Black: 4
            L / Black: 0
        facts:
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/Fact'
          description: Answers to the "buyers will ask" questions in `suggestions.missingFacts`. Each becomes a product detail on the page (replacing one with the same label) and drops off the list.
    Shop:
      title: Shop
      required:
      - id
      - slug
      - status
      - product_type
      - price_cents
      - currency
      - spec
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
