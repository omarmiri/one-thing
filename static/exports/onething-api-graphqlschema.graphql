# API Name: "OneThing API"
# Host: https://one-thing-ash0.onrender.com
# OneThing turns a photo, a link or a picked product into a live one-product shop that takes\nPayPal payments, or a recommendation page that earns referral commissions through Channel3.\n\n**How a shop is made**\n1. `createShop`: start from a photo, a link, or a Channel3 product. Gemini guesses what it\n   is, how it's delivered, the price, a short link and the page design. You get back the\n   shop's link name and an **admin token**.\n2. `updateShop`: correct anything the AI guessed, then set `status: live`.\n3. Buyers pay on `https://<host>/<slug>` with PayPal. Sellers read orders and ship them.\n\n**Auth.** Seller endpoints take the shop's admin token in the `x-admin-token` header, or a\n**platform API key** (`Authorization: Bearer ot_sk_…`) for marketplaces that make shops for\ntheir own sellers. Buyer endpoints (checkout, access-code verification, downloads) are public.\n\n**Access codes.** A digital product can unlock an app or game instead of shipping a file.\nEach paid order gets a code such as `K7QF-M2XP-9HTD`; your app calls `verifyAccessCode`\nbefore unlocking. Raptor Rush on miriogames.com is a live example.\n\n**Agent-ready.** Every live shop is also published for AI shopping agents: an MCP server at\n`/api/mcp` with `search_shops`, `get_product`, `create_order` and `get_order`, and the same\nfour as plain GETs for assistants that can only fetch URLs (`listAgentShops`,\n`getAgentProduct`, `orderByLink`, `getAgentOrder`), with `/llms.txt` as the starting point.\nOrder and status links also have short forms, `/<slug>/buy` and `/o/<order_id>/status`.\nAn agent can find and order, but the buyer still approves every payment at PayPal.\n\n**Limits.** Calls that cost something are capped per network: 120 checkouts per 10 minutes,\n10 new shops an hour and 60 AI requests an hour. Over the cap the reply is a 429 with\n`Retry-After`.\n\nAll money moves through PayPal (sandbox in this deployment). OneThing never holds card data.

"Who designed the page: `gemini`, or `fallback` when Gemini wasn't available and a plain template was used."
enum AiSource {
    FALLBACK
    GEMINI
}

"The carrier. `OTHER` needs `carrierName`."
enum Carrier {
    DHL
    FEDEX
    OTHER
    UPS
    USPS
}

"`agent` for orders an AI agent placed (MCP or an order link)."
enum Channel {
    AGENT
    WEB
}

"For digital products. If omitted, the AI guesses."
enum Delivery {
    ACCESS_CODE
    FILE
}

"Digital products: `file` or `access_code`."
enum Delivery1 {
    ACCESS_CODE
    FILE
}

"Digital products: `file` (a download) or `access_code` (a code that unlocks an app or game)."
enum Delivery2 {
    ACCESS_CODE
    FILE
}

"What happened."
enum Event {
    ORDERPAID
    ORDERREFUNDED
    ORDERSHIPPED
}

"`to_ship` until the seller adds tracking, then `shipped`."
enum Fulfillment {
    SHIPPED
    TO_SHIP
}

"`to_ship` and `shipped` for physical orders, `digital_sent` for digital ones, `none` before payment."
enum FulfillmentStatus {
    DIGITAL_SENT
    NONE
    SHIPPED
    TO_SHIP
}

"Hero art: `pending` while generating, then `ready` or `failed`; `none` if not requested."
enum HeroStatus {
    FAILED
    NONE
    PENDING
    READY
}

"`color` shows swatches, and the photo of the picked colour."
enum Kind {
    COLOR
    OTHER
    SIZE
}

"`physical` ships, `digital` downloads or unlocks with a code, `referral` is bought at another store."
enum Kind1 {
    DIGITAL
    PHYSICAL
    REFERRAL
}

"`physical`, `digital` or `referral`."
enum Kind2 {
    DIGITAL
    PHYSICAL
    REFERRAL
}

"The page template: `bold-hero` (image first, punchy), `editorial` (magazine), `minimal` (quiet, lots of space) or `playful`."
enum Layout {
    BOLDHERO
    EDITORIAL
    MINIMAL
    PLAYFUL
}

"The MCP method. `tools/call` runs a tool; `tools/list` lists them."
enum Method {
    INITIALIZE
    NOTIFICATIONSINITIALIZED
    PING
    TOOLSCALL
    TOOLSLIST
}

"`referral` only for shops created from Channel3."
enum ProductType {
    DIGITAL
    PHYSICAL
    REFERRAL
}

"`physical` ships, `digital` downloads or unlocks, `referral` recommends a Channel3 product."
enum ProductType1 {
    DIGITAL
    PHYSICAL
    REFERRAL
}

"What the AI decided the product is."
enum ProductType2 {
    DIGITAL
    PHYSICAL
}

"`physical`, `digital` or `referral`."
enum ProductType3 {
    DIGITAL
    PHYSICAL
    REFERRAL
}

"What the shop starts from: a photo (with an optional description), a product link, or a Channel3 product to recommend."
enum Source {
    CHANNEL3
    LINK
    PHOTO
}

"`live` publishes the shop; `draft` takes it down."
enum Status {
    DRAFT
    LIVE
}

"`draft` until the seller goes live; only `live` shops take orders."
enum Status1 {
    DRAFT
    LIVE
}

"`declined`: PayPal declined it, nothing charged, the buyer can open `pay_url` again. `sold_out`: it sold out before the payment was captured. `expired`: the PayPal checkout expired; create a new order. `failed`: PayPal couldn't be reached; ask again."
enum Status2 {
    AWAITING_BUYER_APPROVAL
    DECLINED
    EXPIRED
    FAILED
    PAID
    SOLD_OUT
}

"`draft` until the seller goes live."
enum Status3 {
    DRAFT
    LIVE
}

"`created` until paid; `failed` if PayPal declined; `refunded` after a refund."
enum Status4 {
    CREATED
    FAILED
    PAID
    REFUNDED
}

"Only shops with this status, e.g. `live` for a public catalog."
enum Status5 {
    DRAFT
    LIVE
}

"`pending` until the buyer approves at PayPal."
enum Status6 {
    PENDING
}

"`physical` ships, `digital` is a file or an access code, `auto` lets the AI decide."
enum Type {
    AUTO
    DIGITAL
    PHYSICAL
}

"`json` keeps the JSON for a person opening the link in a browser."
enum View {
    JSON
}

