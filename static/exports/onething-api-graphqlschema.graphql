type Query {
    "A link for a browser, not for code: redirects to PayPal's sign-in page. PayPal sends the seller back to `/api/account/paypal/callback`, which signs them in (creating the account the first time), records the PayPal account their sales are paid into, and redirects to `next`."
    getLoginwithpaypal(input: GetLoginwithpaypalInput!): String
    "Everything about the shop, including the AI's design spec and guesses."
    getShop(input: GetShopInput!): Shop!
    "Asks PayPal where the seller's connection stands and saves it on the shop. Also finds a connection the seller finished at PayPal without coming back."
    getPayPalConnection(input: GetPayPalConnectionInput!): ApiShopsPaypalResponse1!
    "Normalises a proposed link name and says whether a new shop can use it."
    getChecklinkname(input: GetChecklinknameInput!): ApiSlugsCheckResponse!
    "Searches 100M+ products from 25k+ stores through Channel3. Pass a result's `id` to `createShop` with `source=channel3`."
    searchProducts(input: SearchProductsInput!): ApiChannel3SearchResponse!
    "A browser-safe client token for the PayPal JavaScript SDK v6\n(`paypal.createInstance({ clientToken })`), bound to the requesting site's domain.\nShop pages call this before showing the PayPal button."
    getPayPalClientToken(input: GetPayPalClientTokenInput!): ApiPaypalClientTokenResponse!
    "Newest first. Checkouts that were never approved are left out."
    listOrders(input: ListOrdersInput!): [Order!]
    "The last 50 PayPal webhook deliveries about this shop's orders, with signature results."
    listWebhookEvents(input: ListWebhookEventsInput!): [WebhookEvent!]
    "A paid digital order's private link. Works 5 times within 14 days."
    getDownloadfile(input: GetDownloadfileInput!): String!
    "Public images only. Purchased files are never served here."
    getImage(input: GetImageInput!): String!
    "The `pay_url` an agent gives the buyer. It redirects to PayPal's payment page for the order, so PayPal's checkout token never passes through the agent (agent platforms hide such tokens as secrets). A paid order redirects to its thank-you page; an expired checkout goes back to the shop page."
    getOpenpaylink(input: GetOpenpaylinkInput!): String
    "The gallery's live shops for a query: shops matching more of its words first, newest first among equals. Browsing words (\"something interesting to buy\") are ignored, and a query that matches nothing returns the newest shops with `matched: false` rather than an empty list. The GET twin of the MCP `search_shops` tool, for agents that can only fetch URLs. Public. Read a shop with `getAgentProduct`; buy through the MCP server in `mcp_server`, or send the buyer to the shop's `url`."
    listAgentShops(input: ListAgentShopsInput!): ApiAgentShopsResponse!
    "Orders one unit with a GET: the MCP `create_order` tool for AI assistants that can only\nfetch URLs, such as free-tier ChatGPT or Grok. Nothing is charged. The reply has `pay_url`,\nwhere the buyer pays at PayPal, and `status_url` (`getAgentOrder`), which says when they\nhave and what they got.\n\nFor a product with options, pass the buyer's pick as query parameters named after the\noptions (`?Size=9`, or `?Color=Ice+Blue&Size=L`); names and values are matched without\nregard to case. You rarely build this URL yourself: `getAgentProduct` and `/llms.txt`\nwrite it out in full (`order_url`, or `variants[].order_url`), because some assistants\nonly open URLs they have been shown.\n\nEvery request makes a new order, so open it once, after the buyer says to buy. Known\ncrawlers and link previewers get a 403 (and are kept out by `robots.txt`); any other\nleaves an unpaid order at most, since stock is only taken when a payment is captured.\nReplies are `no-store` and `X-Robots-Tag: noindex, nofollow`.\n\n`/<slug>/buy` is the same endpoint at a short URL, and the one `order_url` uses.\nA person clicking the link in a browser (`Sec-Fetch-User: ?1`) is redirected instead; known assistants and headless browsers always get JSON. It goes straight to `pay_url`, or to the shop page when an option is missing\nor unknown."
    getOrderbylink(input: GetOrderbylinkInput!): AgentCreatedOrder!
    "Where an order stands and, once paid, what the buyer got: the access code, the download link, or the shipping address and tracking. The GET twin of the MCP `get_order` tool (and the `status_url` that `create_order` returns), for agents that can only fetch URLs. Public: anyone with the order id can already open its thank-you page. If the buyer has approved at PayPal but nothing has captured the payment yet, this captures it. `/o/<order_id>/status` is the same endpoint at a short URL, and the one `status_url` uses. A person clicking the link in a browser (`Sec-Fetch-User: ?1`) is redirected instead; known assistants and headless browsers always get JSON. It goes to the order's receipt page."
    getAgentOrder(input: GetAgentOrderInput!): AgentOrder!
    "Everything an AI shopping agent needs to describe the product and decide to buy it: price, shipping, delivery, availability, options, images and FAQ. Public. Buying goes through the MCP server named in `mcp_server`, or the `order_url` links. Shop pages also carry the same facts as schema.org `Product` JSON-LD. A person clicking the link in a browser (`Sec-Fetch-User: ?1`) is redirected instead; known assistants and headless browsers always get JSON. It goes to the shop page, unless the link has `?view=json`."
    getAgentProduct(input: GetAgentProductInput!): AgentProduct!
    "Every shop the API key's account owns, newest first, with what a catalog page needs: name, price, cover, link, whether PayPal is connected and how many sales it has."
    listMyShops(input: ListMyShopsInput!): ApiPlatformShopsResponse!
}

type Mutation {
    "Signs in with an email address or a phone number, creating the account the first time. There's no password and no verification (sandbox). The response sets the `ot_session` cookie; shops created with it belong to the account and are listed on `/account`. Signing in with an email also claims older shops whose seller email matches. In a browser, sellers can instead use Log in with PayPal (`/api/account/paypal`), which also records the PayPal account their sales are paid into."
    createSignin(input: CreateSigninInput!): ApiAccountSigninResponse!
    "Ends this browser's session and clears the `ot_session` cookie."
    createSignout(input: CreateSignoutInput!): Ok!
    "Starts a draft shop from one of three sources. Gemini designs the page and guesses the\nsetup; check it with `getShop`, adjust with `updateShop`, then go live.\n\nSent with a session cookie from `signIn`, the shop belongs to that account, which also\nbecomes its seller email (and PayPal email, after Log in with PayPal) unless you give one.\n\n- `source=photo`: a `photo` and/or a `description` of your own product.\n- `source=link`: a `url`. If Channel3 recognises it as a store's product page, the shop\n  becomes a recommendation (`product_type: referral`); otherwise the page is read and you\n  sell the product yourself with PayPal.\n- `source=channel3`: a `productId` from `searchProducts` (a recommendation).\n\nTakes 15–40 seconds. Hero art, if available, is generated afterwards (`hero_status`).\n\n**Platforms:** sent with a platform API key, the shop belongs to the key's account, so the\nkey can manage it from then on (no need to keep the admin token). It's made for one of the\nplatform's sellers, so it inherits nothing from the account: set `paypal_email` or call\n`connectPayPal` for that seller."
    createShop(input: CreateShopInput!): CreatedShop!
    "Changes only the fields you send. Renaming `slug` keeps the old link working (it\nredirects). Set `status: live` to publish; a digital product needs its file (or, for\naccess codes, `access_url`) first."
    updateShop(input: UpdateShopInput!): ApiShopsResponse!
    "\"Make it warmer\", \"shorter copy\", \"more premium\". Gemini edits the design spec."
    createRefineshopdesign(input: CreateRefineshopdesignInput!): ApiShopsRefineResponse!
    "Starts generation in the background. Poll `getShop` for `hero_status`."
    createRegenerateheroart(input: CreateRegenerateheroartInput!): Ok!
    "Uploads or replaces a digital product's file, up to 25 MB. Each paid order gets a download link for it."
    uploadDigitalFile(input: UploadDigitalFileInput!): ApiShopsFileResponse!
    "Adds one or more photos after the cover. Each is turned upright, resized to at most 2000 px and stored as WebP. A shop holds up to 8 photos; buyers swipe through them on the shop page. Not for recommendations, which show the retailer's photos."
    addPhotos(input: AddPhotosInput!): ShopPhotos!
    "Sets the photo order; the first becomes the cover. Leaving a photo out removes it."
    updateSetphotoorder(input: UpdateSetphotoorderInput!): ShopPhotos!
    "Asks Gemini what buyers will want to choose (sizes, colours) and what they'll ask that the\nlisting doesn't say (dimensions, materials). `createShop` already does this once; call it\nagain after editing the product. The result is saved as the shop's `suggestions`.\n\nNothing changes on the shop page until the seller confirms: save options with `updateShop`\n(`options`), and answer the questions with `updateShop` (`facts`). Not for recommendations."
    createCheckmissingdetails(input: CreateCheckmissingdetailsInput!): Suggestions!
    "Gemini looks at the shop's photos and says which one shows each colour, so buyers who pick a colour see it. Suggests only; save the matches with `setColorPhotos`. Needs at least two photos."
    createMatchcolorphotos(input: CreateMatchcolorphotosInput!): ApiShopsMatchPhotosResponse!
    "Saves which photo shows each colour, and nothing else about the shop. Only colours already saved in the shop's options change; `null` clears a colour's photo. A photo id that isn't one of the shop's photos is ignored."
    updateSetcolorphotos(input: UpdateSetcolorphotosInput!): ApiShopsColorPhotosResponse!
    "Starts PayPal's seller onboarding (Partner Referrals). Send the seller's browser to the\nreturned `url`; they sign in to PayPal (or create a business account) and grant OneThing\npermission. PayPal brings them back to `/api/shops/<slug>/paypal/return`, which saves the\nconnection and opens the manage page. From then on, sales are paid to that account.\n\nWithout a connection, a shop can still go live with a typed `paypal_email`.\n\n**Platforms:** call it with your API key and a `returnUrl`, and PayPal's flow ends on your own\npage instead, as `returnUrl?paypal=connected|incomplete|cancelled|failed&shop=<slug>`. The\nURL's origin must be one registered on the key."
    createConnectpaypal(input: CreateConnectpaypalInput!): ApiShopsPaypalResponse!
    "Forgets the connected account. Sales go back to the shop's `paypal_email`."
    deleteDisconnectpaypal(input: DeleteDisconnectpaypalInput!): Ok!
    "Creates the PayPal order for one unit of a live shop's product. The amount always comes\nfrom the shop, never from the caller. Pass the returned `id` to the PayPal JS SDK.\n\nIf the shop has buyer `options`, send one value for each. A sold-out combination answers 409."
    createCheckoutOrder(input: CreateCheckoutOrderInput!): ApiOrdersResponse!
    "Call after the buyer approves. Records the sale; digital orders get a download link or access code.\nSafe to call repeatedly: before approval it answers 409, so a page can poll it while the PayPal window is open."
    createCapturecheckoutorder(input: CreateCapturecheckoutorderInput!): ApiOrdersCaptureResponse!
    "For apps and games sold with access codes. Callable from any origin (CORS `*`): it only\nanswers valid or not for one shop, and counts uses. Accepts the shop's current or former\nlink names, and codes typed loosely (lower case, spaces, no dashes)."
    createVerifyaccesscode(input: CreateVerifyaccesscodeInput!): ApiAccessVerifyResponse!
    "Saves the tracking number and pushes it to PayPal, so the buyer sees it in PayPal."
    createMarkordershipped(input: CreateMarkordershippedInput!): ApiShopsOrdersShipResponse!
    "Refunds the whole payment through PayPal and marks the order `refunded`. When PayPal only lets the paid account refund it (the money went to a PayPal email the seller typed in, not a connected account), the reply is a 409 with `refundInPayPal: true`. Refund it in your PayPal account, then call this again with `{\"record\": true}`, which only marks it refunded here. Sends the `order.refunded` event to the shop's Zapier hook."
    createRefundorder(input: CreateRefundorderInput!): ApiShopsOrdersRefundResponse!
    "A [Model Context Protocol](https://modelcontextprotocol.io) server, so agents such as\nClaude can shop here. Add `https://<host>/api/mcp` to an MCP client as a Streamable HTTP\nserver. It's stateless: each POST carries one JSON-RPC 2.0 message (or a batch) and gets a\nplain JSON reply, with no event stream. The `initialize` reply's `Mcp-Session-Id` header\ncarries the client's `clientInfo.name`; send it back on later requests (MCP clients do)\nso the seller's stats show which agent sent the buyer. Nothing else is kept.\n\nMethods: `initialize`, `ping`, `tools/list`, `tools/call`, and `resources/list`,\n`resources/templates/list` and `resources/read` for the product card. Each tool carries\n`annotations` (only `create_order` isn't `readOnlyHint`). Tools:\n\n| Tool | Arguments | What it does |\n|---|---|---|\n| `search_shops` | `query?`, `limit?` (1–25) | Live gallery shops, best match first; no match returns the newest with `matched: false` |\n| `get_product` | `shop` | The same object as `getAgentProduct` |\n| `create_order` | `shop`, `options?` | One unit on order; returns `order_id` and `pay_url` |\n| `get_order` | `order_id` | Status and `next_step`; once paid, the receipt and `delivery` |\n\n**The buyer always approves.** `create_order` charges nothing: the agent shows the buyer\n`pay_url` (`/o/<order_id>`, see `openPayLink`), which opens PayPal. It's a plain link on this\nsite, so agent platforms that hide PayPal's checkout tokens can still show it. When the buyer\nsays they've paid, the agent calls `get_order`.\n\n`get_order` status is one of `awaiting_buyer_approval`, `paid`, `declined` (nothing charged;\nthe buyer can open `pay_url` again), `sold_out`, `expired` (call `create_order` again) or\n`failed` (PayPal couldn't be reached; try again), with a `next_step` the agent can follow.\nA paid order carries `delivery`: `{type: access_code, access_code, start_url?}`,\n`{type: download, download_url}` or `{type: shipping, ship_to, fulfillment, tracking}`, plus\n`amount` with item, shipping and total. Orders made this way show `channel: agent` in\n`listOrders`.\n\n**The product card.** Hosts that draw MCP Apps UI (ChatGPT, or a client that declares the\n`io.modelcontextprotocol/ui` extension) get `search_shops`, `get_product` and\n`create_order` results as a card with the real photos, options and a Pay with PayPal button\n(`ui://onething/shop-card-v1.html`). For them `show_buyer` is a one-line note rather than\nMarkdown, so the model doesn't repeat or invent what the card shows.\n\nTool errors (an unknown shop, a sold-out size, over the checkout cap) come back as results\nwith `isError: true`, so the model can read them and try something else."
    createCallmcp(input: CreateCallmcpInput!): String!
}

