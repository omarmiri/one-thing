type Query {
    "A link for a browser, not for code: redirects to PayPal's sign-in page. PayPal sends the seller back to `/api/account/paypal/callback`, which signs them in (creating the account the first time), records the PayPal account their sales are paid into, and redirects to `next`."
    getLoginwithpaypal(input: GetLoginwithpaypalInput!): String
    "Everything about the shop, including the AI's design spec and guesses."
    getShop(input: GetShopInput!): Shop!
    "Asks PayPal where the seller's connection stands and saves it on the shop. Also finds a connection the seller finished at PayPal without coming back."
    getPayPalConnection(input: GetPayPalConnectionInput!): ApiShopsPaypalResponse1!
    "Normalises a proposed link name and says whether a new shop can use it."
    getChecklinkname(input: GetChecklinknameInput!): ApiSlugsCheckResponse!
    "Searches 100M+ products from 25k+ stores through Channel3. Pass a result's `id` to `createShop` with `source=channel3`."
    searchProducts(input: SearchProductsInput!): ApiChannel3SearchResponse!
    "A browser-safe client token for the PayPal JavaScript SDK v6\n(`paypal.createInstance({ clientToken })`), bound to the requesting site's domain.\nShop pages call this before showing the PayPal button."
    getPayPalClientToken(input: GetPayPalClientTokenInput!): ApiPaypalClientTokenResponse!
    "Newest first. Checkouts that were never approved are left out."
    listOrders(input: ListOrdersInput!): [Order!]
    "The last 50 PayPal webhook deliveries about this shop's orders, with signature results."
    listWebhookEvents(input: ListWebhookEventsInput!): [WebhookEvent!]
    "A paid digital order's private link. Works 5 times within 14 days."
    getDownloadfile(input: GetDownloadfileInput!): String!
    "Public images only. Purchased files are never served here."
    getImage(input: GetImageInput!): String!
    "Everything an AI shopping agent needs to describe the product and decide to buy it: price, shipping, delivery, availability, options, images and FAQ. Public. Buying goes through the MCP server named in `mcp_server`. Shop pages also carry the same facts as schema.org `Product` JSON-LD."
    getAgentProduct(input: GetAgentProductInput!): AgentProduct!
}

type Mutation {
    "Signs in with an email address or a phone number, creating the account the first time. There's no password and no verification (sandbox). The response sets the `ot_session` cookie; shops created with it belong to the account and are listed on `/account`. Signing in with an email also claims older shops whose seller email matches. In a browser, sellers can instead use Log in with PayPal (`/api/account/paypal`), which also records the PayPal account their sales are paid into."
    createSignin(input: CreateSigninInput!): ApiAccountSigninResponse!
    "Ends this browser's session and clears the `ot_session` cookie."
    createSignout(input: CreateSignoutInput!): Ok!
    "Starts a draft shop from one of three sources. Gemini designs the page and guesses the\nsetup; check it with `getShop`, adjust with `updateShop`, then go live.\n\nSent with a session cookie from `signIn`, the shop belongs to that account, which also\nbecomes its seller email (and PayPal email, after Log in with PayPal) unless you give one.\n\n- `source=photo`: a `photo` and/or a `description` of your own product.\n- `source=link`: a `url`. If Channel3 recognises it as a store's product page, the shop\n  becomes a recommendation (`product_type: referral`); otherwise the page is read and you\n  sell the product yourself with PayPal.\n- `source=channel3`: a `productId` from `searchProducts` (a recommendation).\n\nTakes 15–40 seconds. Hero art, if available, is generated afterwards (`hero_status`)."
    createShop(input: CreateShopInput!): CreatedShop!
    "Changes only the fields you send. Renaming `slug` keeps the old link working (it\nredirects). Set `status: live` to publish; a digital product needs its file (or, for\naccess codes, `access_url`) first."
    updateShop(input: UpdateShopInput!): ApiShopsResponse!
    "\"Make it warmer\", \"shorter copy\", \"more premium\". Gemini edits the design spec."
    createRefineshopdesign(input: CreateRefineshopdesignInput!): ApiShopsRefineResponse!
    "Starts generation in the background. Poll `getShop` for `hero_status`."
    createRegenerateheroart(input: CreateRegenerateheroartInput!): Ok!
    "Uploads or replaces a digital product's file, up to 25 MB. Each paid order gets a download link for it."
    uploadDigitalFile(input: UploadDigitalFileInput!): ApiShopsFileResponse!
    "Adds one or more photos after the cover. Each is turned upright, resized to at most 2000 px and stored as WebP. A shop holds up to 8 photos; buyers swipe through them on the shop page. Not for recommendations, which show the retailer's photos."
    addPhotos(input: AddPhotosInput!): ShopPhotos!
    "Sets the photo order; the first becomes the cover. Leaving a photo out removes it."
    updateSetphotoorder(input: UpdateSetphotoorderInput!): ShopPhotos!
    "Asks Gemini what buyers will want to choose (sizes, colours) and what they'll ask that the\nlisting doesn't say (dimensions, materials). `createShop` already does this once; call it\nagain after editing the product. The result is saved as the shop's `suggestions`.\n\nNothing changes on the shop page until the seller confirms: save options with `updateShop`\n(`options`), and answer the questions with `updateShop` (`facts`). Not for recommendations."
    createCheckmissingdetails(input: CreateCheckmissingdetailsInput!): Suggestions!
    "Gemini looks at the shop's photos and says which one shows each colour, so buyers who pick a colour see it. Suggests only; save the matches with `setColorPhotos`. Needs at least two photos."
    createMatchcolorphotos(input: CreateMatchcolorphotosInput!): ApiShopsMatchPhotosResponse!
    "Saves which photo shows each colour, and nothing else about the shop. Only colours already saved in the shop's options change; `null` clears a colour's photo. A photo id that isn't one of the shop's photos is ignored."
    updateSetcolorphotos(input: UpdateSetcolorphotosInput!): ApiShopsColorPhotosResponse!
    "Starts PayPal's seller onboarding (Partner Referrals). Send the seller's browser to the\nreturned `url`; they sign in to PayPal (or create a business account) and grant OneThing\npermission. PayPal brings them back to `/api/shops/<slug>/paypal/return`, which saves the\nconnection and opens the manage page. From then on, sales are paid to that account.\n\nWithout a connection, a shop can still go live with a typed `paypal_email`."
    createConnectpaypal(input: CreateConnectpaypalInput!): ApiShopsPaypalResponse!
    "Forgets the connected account. Sales go back to the shop's `paypal_email`."
    deleteDisconnectpaypal(input: DeleteDisconnectpaypalInput!): Ok!
    "Creates the PayPal order for one unit of a live shop's product. The amount always comes\nfrom the shop, never from the caller. Pass the returned `id` to the PayPal JS SDK.\n\nIf the shop has buyer `options`, send one value for each. A sold-out combination answers 409."
    createCheckoutOrder(input: CreateCheckoutOrderInput!): ApiOrdersResponse!
    "Call after the buyer approves. Records the sale; digital orders get a download link or access code.\nSafe to call repeatedly: before approval it answers 409, so a page can poll it while the PayPal window is open."
    createCapturecheckoutorder(input: CreateCapturecheckoutorderInput!): ApiOrdersCaptureResponse!
    "For apps and games sold with access codes. Callable from any origin (CORS `*`): it only\nanswers valid or not for one shop, and counts uses. Accepts the shop's current or former\nlink names, and codes typed loosely (lower case, spaces, no dashes)."
    createVerifyaccesscode(input: CreateVerifyaccesscodeInput!): ApiAccessVerifyResponse!
    "Saves the tracking number and pushes it to PayPal, so the buyer sees it in PayPal."
    createMarkordershipped(input: CreateMarkordershippedInput!): ApiShopsOrdersShipResponse!
    "A [Model Context Protocol](https://modelcontextprotocol.io) server, so agents such as\nClaude can shop here. Add `https://<host>/api/mcp` to an MCP client as a Streamable HTTP\nserver. It's stateless: each POST carries one JSON-RPC 2.0 message (or a batch) and gets a\nplain JSON reply, with no session and no event stream.\n\nMethods: `initialize`, `ping`, `tools/list`, `tools/call`. Tools:\n\n| Tool | Arguments | What it does |\n|---|---|---|\n| `search_shops` | `query?`, `limit?` (1–25) | Live gallery shops whose name or headline has every word |\n| `get_product` | `shop` | The same object as `getAgentProduct` |\n| `create_order` | `shop`, `options?` | One unit on order; returns `order_id` and `approve_url` |\n| `get_order` | `order_id` | `awaiting_buyer_approval` or `paid`, with the receipt link once paid |\n\n**The buyer always approves.** `create_order` charges nothing: the agent gives the buyer\n`approve_url`, they pay at PayPal, and the agent polls `get_order`. Orders made this way\nshow `channel: agent` in `listOrders`.\n\nTool errors (an unknown shop, a sold-out size) come back as results with `isError: true`,\nso the model can read them and try something else."
    createCallmcp(input: CreateCallmcpInput!): String!
}

schema {
    mutation: Mutation
    query: Query
}
