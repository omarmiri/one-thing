openapi: 3.1.0
info:
  title: OneThing API
  version: 1.0.0
  summary: One product, one page, paid with PayPal. Designed by AI.
  description: |
    OneThing turns a photo, a link or a picked product into a live one-product shop that takes
    PayPal payments, or a recommendation page that earns referral commissions through Channel3.

    **How a shop is made**
    1. `createShop`: start from a photo, a link, or a Channel3 product. Gemini guesses what it
       is, how it's delivered, the price, a short link and the page design. You get back the
       shop's link name and an **admin token**.
    2. `updateShop`: correct anything the AI guessed, then set `status: live`.
    3. Buyers pay on `https://<host>/<slug>` with PayPal. Sellers read orders and ship them.

    **Auth.** Seller endpoints take the shop's admin token in the `x-admin-token` header, or a
    **platform API key** (`Authorization: Bearer ot_sk_…`) for marketplaces that make shops for
    their own sellers. Buyer endpoints (checkout, access-code verification, downloads) are public.

    **Access codes.** A digital product can unlock an app or game instead of shipping a file.
    Each paid order gets a code such as `K7QF-M2XP-9HTD`; your app calls `verifyAccessCode`
    before unlocking. Raptor Rush on miriogames.com is a live example.

    **Agent-ready.** Every live shop is also published for AI shopping agents: an MCP server at
    `/api/mcp` with `search_shops`, `get_product`, `create_order` and `get_order`, and the same
    four as plain GETs for assistants that can only fetch URLs (`listAgentShops`,
    `getAgentProduct`, `orderByLink`, `getAgentOrder`), with `/llms.txt` as the starting point.
    An agent can find and order, but the buyer still approves every payment at PayPal.

    All money moves through PayPal (sandbox in this deployment). OneThing never holds card data.
  contact:
    name: OneThing
    url: https://github.com/omarmiri/one-thing
  license:
    name: MIT
    identifier: MIT
  # APIMatic: names the SDK environments (Environment.Production / Environment.Local).
  x-server-configuration:
    default-environment: production
    default-server: default
    environments:
      - name: production
        description: Hackathon deployment (PayPal sandbox)
        servers:
          - name: default
            url: https://one-thing-ash0.onrender.com
      - name: local
        description: Local development
        servers:
          - name: default
            url: http://localhost:3000
servers:
  - url: https://one-thing-ash0.onrender.com
    description: Hackathon deployment (PayPal sandbox)
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Accounts
    description: Sign in as a seller with an email or a phone number. Shops made while signed in belong to the account.
  - name: Shops
    description: Create a shop and manage it as its seller.
  - name: Links
    description: Short shop links (`/<slug>`).
  - name: Products
    description: Find products to recommend (Channel3 catalog).
  - name: Checkout
    description: Buyer-side PayPal checkout.
  - name: Access codes
    description: Unlock a paid app or game with a buyer's code.
  - name: Orders
    description: The seller's orders, fulfilment and PayPal webhook log.
  - name: Files
    description: Digital downloads and shop images.
  - name: Agents
    description: Machine-readable shops and the MCP server AI shopping agents buy through.
  - name: Platforms
    description: For marketplaces that make and run shops for their own sellers with one API key.

security: []

paths:
  /api/account/signin:
    post:
      tags: [Accounts]
      operationId: signIn
      summary: Sign in or sign up
      description: >-
        Signs in with an email address or a phone number, creating the account the first time.
        There's no password and no verification (sandbox). The response sets the `ot_session`
        cookie; shops created with it belong to the account and are listed on `/account`.
        Signing in with an email also claims older shops whose seller email matches. In a browser,
        sellers can instead use Log in with PayPal (`/api/account/paypal`), which also records the
        PayPal account their sales are paid into.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              email:
                summary: With an email
                value:
                  identifier: maker@example.com
              phone:
                summary: With a phone number
                value:
                  identifier: +1 555 123 4567
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: An email address, or a phone number (spaces, dashes and brackets are ignored; keep a leading +).
                  examples: ['maker@example.com', '+1 555 123 4567']
      responses:
        '200':
          description: Signed in. The `ot_session` cookie is set.
          headers:
            Set-Cookie:
              description: 'The session cookie: `ot_session=<token>`, HttpOnly, for a year.'
              example: ot_session=Rk2v9QxN4tLm8pWz0cYb7HsE; Path=/; HttpOnly; SameSite=lax; Max-Age=31536000
              schema:
                type: string
          content:
            application/json:
              example:
                id: Vq3nN8cT0bLx2YwE
                email: maker@example.com
                phone: null
              schema:
                type: object
                required: [id, email, phone]
                properties:
                  id:
                    type: string
                  email:
                    type: [string, 'null']
                    description: Lower-cased.
                  phone:
                    type: [string, 'null']
                    description: Digits, with a leading + if one was given.
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/account/signout:
    post:
      tags: [Accounts]
      operationId: signOut
      summary: Sign out
      description: Ends this browser's session and clears the `ot_session` cookie.
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/account/paypal:
    get:
      tags: [Accounts]
      operationId: logInWithPayPal
      summary: Log in with PayPal (browser)
      description: >-
        A link for a browser, not for code: redirects to PayPal's sign-in page. PayPal sends the
        seller back to `/api/account/paypal/callback`, which signs them in (creating the account the
        first time), records the PayPal account their sales are paid into, and redirects to `next`.
      parameters:
        - name: next
          in: query
          required: false
          description: A path on this site to land on afterwards. Defaults to `/account`.
          schema:
            type: string
            examples: ['/new']
      responses:
        '302':
          description: To PayPal's sign-in page.
        '503':
          description: Log in with PayPal isn't switched on for this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/shops:
    post:
      tags: [Shops]
      operationId: createShop
      summary: Create a shop (AI draft)
      description: |
        Starts a draft shop from one of three sources. Gemini designs the page and guesses the
        setup; check it with `getShop`, adjust with `updateShop`, then go live.

        Sent with a session cookie from `signIn`, the shop belongs to that account, which also
        becomes its seller email (and PayPal email, after Log in with PayPal) unless you give one.

        - `source=photo`: a `photo` and/or a `description` of your own product.
        - `source=link`: a `url`. If Channel3 recognises it as a store's product page, the shop
          becomes a recommendation (`product_type: referral`); otherwise the page is read and you
          sell the product yourself with PayPal.
        - `source=channel3`: a `productId` from `searchProducts` (a recommendation).

        Takes 15–40 seconds. Hero art, if available, is generated afterwards (`hero_status`).

        **Platforms:** sent with a platform API key, the shop belongs to the key's account, so the
        key can manage it from then on (no need to keep the admin token). It's made for one of the
        platform's sellers, so it inherits nothing from the account: set `paypal_email` or call
        `connectPayPal` for that seller.
      security:
        - {}
        - PlatformKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            examples:
              photo:
                summary: Your own product, described
                value:
                  source: photo
                  description: Vintage cream and red quad roller skates with walnut burl heels.
                  type: physical
                  price: 240
                  shipping: 15
                  ship_countries: US
                  paypal_email: seller@example.com
              link:
                summary: An app or game, sold with access codes
                value:
                  source: link
                  url: https://www.miriogames.com/raptor-rush/
                  type: digital
                  delivery: access_code
                  access_url: https://www.miriogames.com/raptor-rush/play/
                  price: 2.99
                  slug: raptorrush
              channel3:
                summary: A recommendation from searchProducts
                value:
                  source: channel3
                  productId: ch3_7f2a9c1e
            schema:
              $ref: '#/components/schemas/CreateShopForm'
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Draft created.
          content:
            application/json:
              example:
                slug: vintageskates
                token: 3fJ9xQm2LwP8vR1tZk7cN4bY6dHs0aEu
                manageUrl: /manage/vintageskates?token=3fJ9xQm2LwP8vR1tZk7cN4bY6dHs0aEu
              schema:
                $ref: '#/components/schemas/CreatedShop'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/shops/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [Shops]
      operationId: getShop
      summary: Get a shop
      description: Everything about the shop, including the AI's design spec and guesses.
      security:
        - AdminToken: []
        - PlatformKey: []
      responses:
        '200':
          description: The shop.
          content:
            application/json:
              example:
                id: Hn2c8QvL0xTzR4pW
                slug: vintageskates
                status: live
                product_type: physical
                price_cents: 24000
                currency: USD
                shipping_cents: 1500
                ship_countries: US
                stock: null
                delivery: file
                access_url: null
                paypal_email: seller@example.com
                seller_email: seller@example.com
                paypal_merchant_id: 7MZJ4QXN8K2LA
                paypal_status:
                  receivable: true
                  emailConfirmed: true
                  checkedAt: '2026-10-21T18:04:11Z'
                zapier_hook_url: null
                in_gallery: true
                account_id: Vq3nN8cT0bLx2YwE
                options:
                - name: Size
                  kind: size
                  values:
                  - label: '7'
                  - label: '8'
                  - label: '9'
                option_stock:
                  '7': 3
                  '8': 0
                  '9': 6
                suggestions: null
                photo_blob: LFRvGuTU3D8i334X
                gallery_blobs:
                - zrySajNyao6_j11x
                - SuqcgNv64HWN8H6e
                hero_blob: null
                hero_status: none
                hero_error: null
                ai_source: gemini
                source_url: null
                referral: null
                spec:
                  productType: physical
                  productName: Vintage Cream and Red Roller Skates
                  layout: editorial
                  palette:
                    background: '#f6efe4'
                    surface: '#fffaf2'
                    text: '#2b1d14'
                    muted: '#7a6455'
                    accent: '#b3261e'
                    accentText: '#ffffff'
                  fonts:
                    heading: Playfair Display
                    body: Inter
                  eyebrow: One pair, restored
                  headline: Classic quad skates crafted with walnut burl heels
                  subheadline: A vintage pair of skates featuring cream leather, bold red trim, and durable quad wheels.
                  story: Each pair combines soft cream leather with distinct red accents and a sculpted walnut burl heel
                    base.
                  bullets:
                  - Handmade cream leather upper with rich red trim
                  - Sculpted walnut burl heel structure for stability
                  details:
                  - label: Materials
                    value: Leather upper, walnut burl heel, rubber wheels
                  faq:
                  - q: Are these suitable for outdoor skating?
                    a: Yes, on indoor rink floors and paved outdoor paths.
                  ctaLabel: Buy the skates
                  suggestedPriceUsd: 240
                  suggestedShippingUsd: 15
                  imageAlt: Cream leather quad roller skates with red trim
                created_at: '2026-10-19T15:22:08Z'
              schema:
                $ref: '#/components/schemas/Shop'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Shops]
      operationId: updateShop
      summary: Update settings or go live
      description: |
        Changes only the fields you send. Renaming `slug` keeps the old link working (it
        redirects). Set `status: live` to publish; a digital product needs its file (or, for
        access codes, `access_url`) first.
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              golive:
                summary: Go live
                value:
                  status: live
              edit:
                summary: Fix the AI's guesses
                value:
                  price: 240
                  shipping: 15
                  ship_countries: US,CA
                  in_gallery: true
              sizes:
                summary: Sizes with stock per size
                value:
                  options:
                  - name: Size
                    kind: size
                    values:
                    - label: '7'
                    - label: '8'
                    - label: '9'
                  option_stock:
                    '7': 3
                    '8': 0
                    '9': 6
              facts:
                summary: Answer what buyers will ask
                value:
                  facts:
                  - label: Wheel size
                    value: 57 mm
            schema:
              $ref: '#/components/schemas/ShopUpdate'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              example:
                ok: true
                slug: vintageskates
              schema:
                type: object
                required: [ok, slug]
                properties:
                  ok:
                    type: boolean
                  slug:
                    type: string
                    description: The shop's link name after this change.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shops/{slug}/refine:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [Shops]
      operationId: refineShopDesign
      summary: Change the design by asking
      description: '"Make it warmer", "shorter copy", "more premium". Gemini edits the design spec.'
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              instruction: Make it feel more premium
            schema:
              type: object
              required: [instruction]
              properties:
                instruction:
                  type: string
                  maxLength: 500
                  examples: [Make it feel more premium]
      responses:
        '200':
          description: The new design.
          content:
            application/json:
              example:
                spec:
                  productType: physical
                  productName: Vintage Cream and Red Roller Skates
                  layout: editorial
                  palette:
                    background: '#f6efe4'
                    surface: '#fffaf2'
                    text: '#2b1d14'
                    muted: '#7a6455'
                    accent: '#b3261e'
                    accentText: '#ffffff'
                  fonts:
                    heading: Playfair Display
                    body: Inter
                  eyebrow: One pair, restored
                  headline: Classic quad skates crafted with walnut burl heels
                  subheadline: A vintage pair of skates featuring cream leather, bold red trim, and durable quad wheels.
                  story: Each pair combines soft cream leather with distinct red accents and a sculpted walnut burl heel
                    base.
                  bullets:
                  - Handmade cream leather upper with rich red trim
                  - Sculpted walnut burl heel structure for stability
                  details:
                  - label: Materials
                    value: Leather upper, walnut burl heel, rubber wheels
                  faq:
                  - q: Are these suitable for outdoor skating?
                    a: Yes, on indoor rink floors and paved outdoor paths.
                  ctaLabel: Buy the skates
                  suggestedPriceUsd: 240
                  suggestedShippingUsd: 15
                  imageAlt: Cream leather quad roller skates with red trim
              schema:
                type: object
                required: [spec]
                properties:
                  spec:
                    $ref: '#/components/schemas/DesignSpec'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/shops/{slug}/hero:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [Shops]
      operationId: regenerateHeroArt
      summary: Regenerate hero art
      description: Starts generation in the background. Poll `getShop` for `hero_status`.
      security:
        - AdminToken: []
        - PlatformKey: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shops/{slug}/file:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [Shops]
      operationId: uploadDigitalFile
      summary: Upload the file buyers download
      description: Uploads or replaces a digital product's file, up to 25 MB. Each paid order gets a download link for it.
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Up to 25 MB.
      responses:
        '200':
          description: Uploaded.
          content:
            application/json:
              example:
                ok: true
                filename: raptor-rush-soundtrack.zip
              schema:
                type: object
                required: [ok, filename]
                properties:
                  ok:
                    type: boolean
                  filename:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shops/{slug}/photos:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [Shops]
      operationId: addPhotos
      summary: Add product photos
      description: >-
        Adds one or more photos after the cover. Each is turned upright, resized to at most 2000 px
        and stored as WebP. A shop holds up to 8 photos; buyers swipe through them on the shop page.
        Not for recommendations, which show the retailer's photos.
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: An image, up to 15 MB. The endpoint also accepts the field repeated, to add several in one request.
      responses:
        '200':
          $ref: '#/components/responses/ShopPhotos'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Shops]
      operationId: setPhotoOrder
      summary: Reorder or remove photos
      description: Sets the photo order; the first becomes the cover. Leaving a photo out removes it.
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              photos:
              - zrySajNyao6_j11x
              - LFRvGuTU3D8i334X
              - SuqcgNv64HWN8H6e
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                  description: Photo ids, in order.
      responses:
        '200':
          $ref: '#/components/responses/ShopPhotos'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shops/{slug}/suggest:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [Shops]
      operationId: checkMissingDetails
      summary: Check for missing details
      description: |
        Asks Gemini what buyers will want to choose (sizes, colours) and what they'll ask that the
        listing doesn't say (dimensions, materials). `createShop` already does this once; call it
        again after editing the product. The result is saved as the shop's `suggestions`.

        Nothing changes on the shop page until the seller confirms: save options with `updateShop`
        (`options`), and answer the questions with `updateShop` (`facts`). Not for recommendations.
      security:
        - AdminToken: []
        - PlatformKey: []
      responses:
        '200':
          description: The suggestions.
          content:
            application/json:
              example:
                oneOfAKind: false
                options:
                - name: Size
                  kind: size
                  values:
                  - label: '7'
                  - label: '8'
                  - label: '9'
                  fromSeller: false
                missingFacts:
                - label: Wheel size
                  question: How big are the wheels?
                  placeholder: 57 mm
              schema:
                $ref: '#/components/schemas/Suggestions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/shops/{slug}/match-photos:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [Shops]
      operationId: matchColorPhotos
      summary: Match photos to colours
      description: >-
        Gemini looks at the shop's photos and says which one shows each colour, so buyers who pick
        a colour see it. Suggests only; save the matches with `setColorPhotos`. Needs at least two photos.
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              colors:
              - label: Cream
                hex: '#f3e9d2'
              - label: Red
                hex: '#b3261e'
            schema:
              type: object
              required: [colors]
              properties:
                colors:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: object
                    required: [label]
                    properties:
                      label:
                        type: string
                        maxLength: 30
                        examples: [Forest green]
                      hex:
                        $ref: '#/components/schemas/HexColor'
      responses:
        '200':
          description: A photo id for each colour Gemini could match. Colours it couldn't place are left out.
          content:
            application/json:
              example:
                matches:
                  Cream: LFRvGuTU3D8i334X
                  Red: SuqcgNv64HWN8H6e
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: object
                    additionalProperties:
                      type: string
                    examples:
                      - { Black: b_8f2k1, Forest green: b_q93md }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/shops/{slug}/color-photos:
    parameters:
      - $ref: '#/components/parameters/Slug'
    put:
      tags: [Shops]
      operationId: setColorPhotos
      summary: Set the photo for each colour
      description: >-
        Saves which photo shows each colour, and nothing else about the shop. Only colours already
        saved in the shop's options change; `null` clears a colour's photo. A photo id that isn't
        one of the shop's photos is ignored.
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              photos:
                Cream: LFRvGuTU3D8i334X
                Red: null
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: object
                  description: Colour label → photo id, or `null`.
                  additionalProperties:
                    type: [string, 'null']
      responses:
        '200':
          description: The colours that were changed.
          content:
            application/json:
              example:
                saved:
                - Cream
                - Red
              schema:
                type: object
                required: [saved]
                properties:
                  saved:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shops/{slug}/paypal:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [Shops]
      operationId: connectPayPal
      summary: Connect the seller's PayPal account
      description: |
        Starts PayPal's seller onboarding (Partner Referrals). Send the seller's browser to the
        returned `url`; they sign in to PayPal (or create a business account) and grant OneThing
        permission. PayPal brings them back to `/api/shops/<slug>/paypal/return`, which saves the
        connection and opens the manage page. From then on, sales are paid to that account.

        Without a connection, a shop can still go live with a typed `paypal_email`.

        **Platforms:** call it with your API key and a `returnUrl`, and PayPal's flow ends on your own
        page instead, as `returnUrl?paypal=connected|incomplete|cancelled|failed&shop=<slug>`. The
        URL's origin must be one registered on the key.
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: false
        content:
          application/json:
            example:
              returnUrl: https://www.miriogames.com/market/manage/?g=7Hq2
            schema:
              type: object
              properties:
                returnUrl:
                  type: string
                  format: uri
                  description: Platform key only. Where to send the seller after PayPal.
                  examples: ['https://www.miriogames.com/market/manage/?g=7Hq2']
      responses:
        '200':
          description: Where to send the seller.
          content:
            application/json:
              example:
                url: https://www.sandbox.paypal.com/bizsignup/partner/entry?referralToken=EXAMPLE
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: PayPal's onboarding page for this shop.
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'
    get:
      tags: [Shops]
      operationId: getPayPalConnection
      summary: Check the PayPal connection
      description: >-
        Asks PayPal where the seller's connection stands and saves it on the shop. Also finds a
        connection the seller finished at PayPal without coming back.
      security:
        - AdminToken: []
        - PlatformKey: []
      responses:
        '200':
          description: The connection, or nulls if there is none yet.
          content:
            application/json:
              example:
                merchantId: 7MZJ4QXN8K2LA
                status:
                  receivable: true
                  emailConfirmed: true
                  checkedAt: '2026-10-21T18:04:11Z'
              schema:
                type: object
                required: [merchantId, status]
                properties:
                  merchantId:
                    type: [string, 'null']
                    description: The seller's PayPal merchant id.
                  status:
                    oneOf:
                      - $ref: '#/components/schemas/PayPalStatus'
                      - type: 'null'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'
    delete:
      tags: [Shops]
      operationId: disconnectPayPal
      summary: Disconnect PayPal
      description: Forgets the connected account. Sales go back to the shop's `paypal_email`.
      security:
        - AdminToken: []
        - PlatformKey: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/platform/shops:
    get:
      tags: [Platforms]
      operationId: listMyShops
      summary: List the platform's shops
      description: >-
        Every shop the API key's account owns, newest first, with what a catalog page needs: name,
        price, cover, link, whether PayPal is connected and how many sales it has.
      security:
        - PlatformKey: []
      parameters:
        - name: status
          in: query
          required: false
          example: live
          description: Only shops with this status, e.g. `live` for a public catalog.
          schema:
            type: string
            enum: [draft, live]
      responses:
        '200':
          description: The shops.
          content:
            application/json:
              example:
                shops:
                - slug: raptorrush
                  status: live
                  name: 'Raptor Rush: Browser Edition'
                  headline: Grow from Tiny Hatchling to Giant Apex Predator
                  product_type: digital
                  price:
                    amount: 2.99
                    currency: USD
                  url: https://one-thing-ash0.onrender.com/raptorrush
                  cover: https://one-thing-ash0.onrender.com/api/blobs/KchAi9jwZzo76SKh
                  paypal_connected: true
                  sales: 12
                  created_at: '2026-10-12T20:31:44Z'
              schema:
                type: object
                required: [shops]
                properties:
                  shops:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformShop'
        '401':
          description: No API key, or it's wrong or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/shops/{slug}/orders:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List paid orders
      description: Newest first. Checkouts that were never approved are left out.
      security:
        - AdminToken: []
        - PlatformKey: []
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              example:
                - id: pX4kR9tVb2nQ7sLe
                  paypal_order_id: 5O190127TN364715T
                  status: paid
                  amount_cents: 25500
                  shipping_cents: 1500
                  currency: USD
                  buyer_email: buyer@example.com
                  buyer_name: Sam Rivera
                  shipping_address:
                    address_line_1: 1 Main St
                    admin_area_2: Springfield
                    admin_area_1: IL
                    postal_code: '62701'
                    country_code: US
                  capture_id: 3C679366HH908993F
                  fulfillment_status: to_ship
                  carrier: null
                  tracking_number: null
                  tracking_synced: false
                  downloads: 0
                  access_code: null
                  code_uses: 0
                  channel: agent
                  options:
                    Size: '8'
                  paid_at: '2026-10-22T02:41:37Z'
                  created_at: '2026-10-22T02:38:05Z'
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shops/{slug}/orders/{orderId}/ship:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - name: orderId
        in: path
        required: true
        example: pX4kR9tVb2nQ7sLe
        description: OneThing's order id (`Order.id`).
        schema:
          type: string
    post:
      tags: [Orders]
      operationId: markOrderShipped
      summary: Mark a physical order shipped
      description: Saves the tracking number and pushes it to PayPal, so the buyer sees it in PayPal.
      security:
        - AdminToken: []
        - PlatformKey: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              usps:
                summary: A listed carrier
                value:
                  carrier: USPS
                  trackingNumber: '9400111899223817362315'
              other:
                summary: Another carrier
                value:
                  carrier: OTHER
                  carrierName: Canada Post
                  trackingNumber: '7023210039414604'
            schema:
              type: object
              required: [carrier, trackingNumber]
              properties:
                carrier:
                  type: string
                  enum: [USPS, UPS, FEDEX, DHL, OTHER]
                carrierName:
                  type: string
                  maxLength: 60
                  description: Required when `carrier` is `OTHER`.
                trackingNumber:
                  type: string
                  minLength: 4
                  maxLength: 64
      responses:
        '200':
          description: Shipped.
          content:
            application/json:
              example:
                ok: true
                synced: true
              schema:
                type: object
                required: [ok, synced]
                properties:
                  ok:
                    type: boolean
                  synced:
                    type: boolean
                    description: Whether PayPal accepted the tracking number.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shops/{slug}/webhooks:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [Orders]
      operationId: listWebhookEvents
      summary: PayPal webhook log
      description: The last 50 PayPal webhook deliveries about this shop's orders, with signature results.
      security:
        - AdminToken: []
        - PlatformKey: []
      responses:
        '200':
          description: Events, newest first.
          content:
            application/json:
              example:
                - id: WH-2WR32451HC0233532-67976317FL4543714
                  event_type: PAYMENT.CAPTURE.COMPLETED
                  paypal_order_id: 5O190127TN364715T
                  summary: 255.00 USD
                  verified: true
                  outcome: 'Confirmed: order already paid'
                  received_at: '2026-10-22T02:41:40Z'
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/slugs/check:
    get:
      tags: [Links]
      operationId: checkLinkName
      summary: Check a link name
      description: Normalises a proposed link name and says whether a new shop can use it.
      parameters:
        - name: name
          in: query
          required: true
          example: Raptor Rush
          description: Anything; it is normalised (`Raptor Rush` becomes `raptor-rush`).
          schema:
            type: string
      responses:
        '200':
          description: The normalised name and whether it can be used.
          content:
            application/json:
              examples:
                free:
                  summary: Available
                  value:
                    slug: raptor-rush
                    available: true
                taken:
                  summary: Taken
                  value:
                    slug: raptorrush
                    available: false
                    problem: Taken. Try another name.
              schema:
                type: object
                required: [slug, available]
                properties:
                  slug:
                    type: string
                  available:
                    type: boolean
                  problem:
                    type: string
                    description: Why not, when unavailable.

  /api/channel3/search:
    get:
      tags: [Products]
      operationId: searchProducts
      summary: Find products to recommend
      description: Searches 100M+ products from 25k+ stores through Channel3. Pass a result's `id` to `createShop` with `source=channel3`.
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for, in plain words.
          schema:
            type: string
            maxLength: 200
            examples: [gifts for trail runners under $60]
      responses:
        '200':
          description: Up to 12 products.
          content:
            application/json:
              example:
                products:
                - id: ch3_7f2a9c1e
                  title: Trail Running Vest 5L
                  brand: Salomon
                  image: https://images.example.com/vest.jpg
                  price: 59.99
                  currency: USD
                  retailer: rei.com
                  retailers: 4
                  commission: 0.08
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductCard'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'

  /api/paypal/client-token:
    get:
      tags: [Checkout]
      operationId: getPayPalClientToken
      summary: Get a PayPal SDK client token
      description: |
        A browser-safe client token for the PayPal JavaScript SDK v6
        (`paypal.createInstance({ clientToken })`), bound to the requesting site's domain.
        Shop pages call this before showing the PayPal button.
      responses:
        '200':
          description: A token for this site's domain.
          content:
            application/json:
              example:
                clientToken: eyJraWQiOiJFWEFNUExFIn0.example.client-token
              schema:
                type: object
                required: [clientToken]
                properties:
                  clientToken:
                    type: string
                    description: Pass to `createInstance` in the PayPal JavaScript SDK v6.
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'

  /api/orders:
    post:
      tags: [Checkout]
      operationId: createCheckoutOrder
      summary: Start a PayPal checkout
      description: |
        Creates the PayPal order for one unit of a live shop's product. The amount always comes
        from the shop, never from the caller. Pass the returned `id` to the PayPal JS SDK.

        If the shop has buyer `options`, send one value for each. A sold-out combination answers 409.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              plain:
                summary: A product without options
                value:
                  slug: raptorrush
              options:
                summary: With the buyer's size
                value:
                  slug: vintageskates
                  options:
                    Size: '9'
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                options:
                  $ref: '#/components/schemas/Choice'
      responses:
        '200':
          description: PayPal order created.
          content:
            application/json:
              example:
                id: 5O190127TN364715T
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    description: PayPal order id.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'

  /api/orders/{paypalOrderId}/capture:
    parameters:
      - name: paypalOrderId
        in: path
        required: true
        example: 5O190127TN364715T
        description: The PayPal order id that `createCheckoutOrder` returned.
        schema:
          type: string
    post:
      tags: [Checkout]
      operationId: captureCheckoutOrder
      summary: Capture an approved PayPal order
      description: |
        Call after the buyer approves. Records the sale; digital orders get a download link or access code.
        Safe to call repeatedly: before approval it answers 409, so a page can poll it while the PayPal window is open.
      responses:
        '200':
          description: Paid.
          content:
            application/json:
              example:
                orderId: pX4kR9tVb2nQ7sLe
                status: paid
              schema:
                type: object
                required: [orderId, status]
                properties:
                  orderId:
                    type: string
                    description: OneThing's order id; the thank-you page is `/<slug>/thanks?order=<orderId>`.
                  status:
                    type: string
                    const: paid
        '402':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The buyer hasn't approved the order yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]
        '410':
          description: >-
            The last unit (or the last of the buyer's combination) sold while they were paying, or the
            PayPal checkout expired before they paid. The payment isn't captured, so the buyer isn't
            charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The buyer's funding source was declined (`INSTRUMENT_DECLINED`); they can try another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/access/verify:
    post:
      tags: [Access codes]
      operationId: verifyAccessCode
      summary: Verify a buyer's access code
      description: |
        For apps and games sold with access codes. Callable from any origin (CORS `*`): it only
        answers valid or not for one shop, and counts uses. Accepts the shop's current or former
        link names, and codes typed loosely (lower case, spaces, no dashes).
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop: raptorrush
              code: K7QF-M2XP-9HTD
            schema:
              type: object
              required: [shop, code]
              properties:
                shop:
                  type: string
                  description: The shop's link name.
                  examples: [raptorrush]
                code:
                  type: string
                  examples: [K7QF-M2XP-9HTD]
      responses:
        '200':
          description: The answer. Invalid codes are also a 200.
          content:
            application/json:
              examples:
                valid:
                  summary: A valid code
                  value:
                    valid: true
                    product: 'Raptor Rush: Browser Edition'
                invalid:
                  summary: A wrong code
                  value:
                    valid: false
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                  product:
                    type: string
                    description: The product name, when valid.

  /api/download/{token}:
    parameters:
      - name: token
        in: path
        required: true
        example: q2Vd8mLx0RkT4nYb7HcW1sPe
        description: The download token from a paid order's thank-you page.
        schema:
          type: string
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Download a purchased file
      description: A paid digital order's private link. Works 5 times within 14 days.
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '410':
          description: Expired or used up.
          content:
            text/plain:
              schema:
                type: string

  /o/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        example: pX4kR9tVb2nQ7sLe
        description: The `order_id` from the MCP `create_order` tool.
        schema:
          type: string
    get:
      tags: [Agents]
      operationId: openPayLink
      summary: An order's pay link
      description: >-
        The `pay_url` an agent gives the buyer. It redirects to PayPal's payment page for the order,
        so PayPal's checkout token never passes through the agent (agent platforms hide such tokens
        as secrets). A paid order redirects to its thank-you page; an expired checkout goes back to
        the shop page.
      responses:
        '303':
          description: Redirect to PayPal, the thank-you page or the shop page.
        '404':
          description: No order with that id.
          content:
            text/plain:
              schema:
                type: string

  /api/blobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        example: LFRvGuTU3D8i334X
        description: A shop's `photo_blob` or `hero_blob`.
        schema:
          type: string
    get:
      tags: [Files]
      operationId: getImage
      summary: A shop's product photo or hero art
      description: Public images only. Purchased files are never served here.
      responses:
        '200':
          description: The image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Not a public shop image.

  /api/agent/shops:
    get:
      tags: [Agents]
      operationId: listAgentShops
      summary: Find gallery shops, for agents
      description: >-
        The gallery's live shops, newest first, filtered by keywords (every word must appear in the
        name or headline). The GET twin of the MCP `search_shops` tool, for agents that can only
        fetch URLs. Public. Read a shop with `getAgentProduct`; buy through the MCP server in
        `mcp_server`, or send the buyer to the shop's `url`.
      parameters:
        - name: q
          in: query
          required: false
          description: Keywords. Leave out to list the newest shops.
          example: skates
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          description: How many shops, 1–25.
          example: 10
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: The matching shops.
          content:
            application/json:
              example:
                shops:
                - shop: vintageskates
                  name: Vintage Cream and Red Roller Skates
                  kind: physical
                  headline: Classic quad skates crafted with walnut burl heels
                  price: $240.00
                  url: https://one-thing-ash0.onrender.com/vintageskates
                - shop: raptorrush
                  name: 'Raptor Rush: Browser Edition'
                  kind: digital
                  headline: Grow from Tiny Hatchling to Giant Apex Predator
                  price: $2.99
                  url: https://one-thing-ash0.onrender.com/raptorrush
                mcp_server: https://one-thing-ash0.onrender.com/api/mcp
              schema:
                type: object
                required: [shops, mcp_server]
                properties:
                  shops:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentShopSummary'
                  mcp_server:
                    type: string
                    description: The MCP server to order through.

  /api/agent/shops/{slug}/order:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [Agents]
      operationId: orderByLink
      summary: Order with a link, for agents
      description: |
        Orders one unit with a GET: the MCP `create_order` tool for AI assistants that can only
        fetch URLs, such as free-tier ChatGPT or Grok. Nothing is charged. The reply has `pay_url`,
        where the buyer pays at PayPal, and `status_url` (`getAgentOrder`), which says when they
        have and what they got.

        For a product with options, pass the buyer's pick as query parameters named after the
        options (`?Size=9`, or `?Color=Ice+Blue&Size=L`); names and values are matched without
        regard to case. You rarely build this URL yourself: `getAgentProduct` and `/llms.txt`
        write it out in full (`order_url`, or `variants[].order_url`), because some assistants
        only open URLs they have been shown.

        Every request makes a new order, so open it once, after the buyer says to buy. A link
        previewer opening it leaves an unpaid order at most: stock is only taken when a payment
        is captured. Replies are `no-store` and `X-Robots-Tag: noindex, nofollow`.
      parameters:
        - name: Size
          in: query
          required: false
          description: >-
            An example option. The real parameter names are the product's option names from
            `getAgentProduct` (`options[].name`), one per option.
          example: '9'
          schema:
            type: string
      responses:
        '200':
          description: The order, waiting for the buyer to pay.
          content:
            application/json:
              example:
                order_id: pX4kR9tVb2nQ7sLe
                status: awaiting_buyer_approval
                total: $255.00
                options:
                  Size: '9'
                pay_url: https://one-thing-ash0.onrender.com/o/pX4kR9tVb2nQ7sLe
                status_url: https://one-thing-ash0.onrender.com/api/agent/orders/pX4kR9tVb2nQ7sLe
                next_step: >-
                  Show pay_url to the buyer as a link. It opens PayPal, where they pay (and enter a
                  shipping address for physical items). When they say they've paid, open status_url
                  (or with MCP, call get_order with order_id): it returns the access code, download
                  link or shipping details.
              schema:
                $ref: '#/components/schemas/AgentCreatedOrder'
        '400':
          description: A missing or unknown option value, or sold out. `error` names the valid values.
          content:
            application/json:
              example:
                error: 'Unknown Size "12". Size: one of 7, 8, 9.'
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No live shop with that link name.
          content:
            application/json:
              example:
                error: No live shop called "skatez". Try search_shops.
              schema:
                $ref: '#/components/schemas/Error'

  /api/agent/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        example: pX4kR9tVb2nQ7sLe
        description: The `order_id` from the MCP `create_order` tool, or from a thank-you page link (`?order=`).
        schema:
          type: string
    get:
      tags: [Agents]
      operationId: getAgentOrder
      summary: An order's status and delivery, for agents
      description: >-
        Where an order stands and, once paid, what the buyer got: the access code, the download
        link, or the shipping address and tracking. The GET twin of the MCP `get_order` tool (and
        the `status_url` that `create_order` returns), for agents that can only fetch URLs. Public:
        anyone with the order id can already open its thank-you page. If the buyer has approved at
        PayPal but nothing has captured the payment yet, this captures it.
      responses:
        '200':
          description: The order.
          content:
            application/json:
              examples:
                waiting:
                  summary: Waiting for the buyer
                  value:
                    order_id: pX4kR9tVb2nQ7sLe
                    status: awaiting_buyer_approval
                    product: Vintage Cream and Red Roller Skates
                    options:
                      Size: '9'
                    amount:
                      item: 240
                      shipping: 15
                      total: 255
                      currency: USD
                    total: $255.00
                    pay_url: https://one-thing-ash0.onrender.com/o/pX4kR9tVb2nQ7sLe
                    next_step: The buyer hasn't paid yet. Give them pay_url; when they say they've paid, call get_order
                      again.
                code:
                  summary: 'Paid: an access code'
                  value:
                    order_id: a9KQqS7zAY5dWv89
                    status: paid
                    product: 'Raptor Rush: Browser Edition'
                    amount:
                      item: 2.99
                      shipping: 0
                      total: 2.99
                      currency: USD
                    total: $2.99
                    paid_at: '2026-10-22T03:12:50Z'
                    receipt_url: https://one-thing-ash0.onrender.com/raptorrush/thanks?order=a9KQqS7zAY5dWv89
                    delivery:
                      type: access_code
                      access_code: K7QF-M2XP-9HTD
                      start_url: https://www.miriogames.com/raptor-rush/play/?code=K7QF-M2XP-9HTD
                shipping:
                  summary: 'Paid: shipped to the buyer'
                  value:
                    order_id: pX4kR9tVb2nQ7sLe
                    status: paid
                    product: Vintage Cream and Red Roller Skates
                    options:
                      Size: '9'
                    amount:
                      item: 240
                      shipping: 15
                      total: 255
                      currency: USD
                    total: $255.00
                    paid_at: '2026-10-22T02:41:37Z'
                    receipt_url: https://one-thing-ash0.onrender.com/vintageskates/thanks?order=pX4kR9tVb2nQ7sLe
                    delivery:
                      type: shipping
                      ship_to:
                        name: Sam Rivera
                        address: 1 Main St, Springfield, IL, 62701, US
                      fulfillment: to_ship
                      tracking: null
                expired:
                  summary: Expired before payment
                  value:
                    order_id: pX4kR9tVb2nQ7sLe
                    status: expired
                    product: Vintage Cream and Red Roller Skates
                    options:
                      Size: '9'
                    amount:
                      item: 240
                      shipping: 15
                      total: 255
                      currency: USD
                    total: $255.00
                    next_step: This checkout expired at PayPal. Nothing was charged. Call create_order for a new one.
              schema:
                $ref: '#/components/schemas/AgentOrder'
        '404':
          description: No order with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/agent/shops/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [Agents]
      operationId: getAgentProduct
      summary: A live shop's product, for agents
      description: >-
        Everything an AI shopping agent needs to describe the product and decide to buy it: price,
        shipping, delivery, availability, options, images and FAQ. Public. Buying goes through the
        MCP server named in `mcp_server`. Shop pages also carry the same facts as schema.org
        `Product` JSON-LD.
      responses:
        '200':
          description: The product.
          content:
            application/json:
              example:
                shop: vintageskates
                url: https://one-thing-ash0.onrender.com/vintageskates
                name: Vintage Cream and Red Roller Skates
                kind: physical
                headline: Classic quad skates crafted with walnut burl heels
                description: A vintage pair of skates featuring cream leather, bold red trim, and durable quad wheels.
                highlights:
                - Handmade cream leather upper with rich red trim
                - Sculpted walnut burl heel structure for stability
                details:
                - label: Materials
                  value: Leather upper, walnut burl heel, rubber wheels
                faq:
                - q: What is the return policy?
                  a: Unworn skates in original condition can be returned within 30 days of delivery.
                images:
                - https://one-thing-ash0.onrender.com/api/blobs/LFRvGuTU3D8i334X
                - https://one-thing-ash0.onrender.com/api/blobs/zrySajNyao6_j11x
                price:
                  amount: 240
                  currency: USD
                  label: $240.00
                shipping:
                  amount: 15
                  currency: USD
                  ships_to:
                  - US
                total:
                  amount: 255
                  currency: USD
                delivery: Shipped. PayPal collects the buyer's address at checkout.
                options:
                - name: Size
                  values:
                  - '7'
                  - '8'
                  - '9'
                variants:
                - choice:
                    Size: '7'
                  availability: in_stock (3 left)
                  order_url: https://one-thing-ash0.onrender.com/api/agent/shops/vintageskates/order?Size=7
                - choice:
                    Size: '8'
                  availability: sold_out
                - choice:
                    Size: '9'
                  availability: in_stock (6 left)
                  order_url: https://one-thing-ash0.onrender.com/api/agent/shops/vintageskates/order?Size=9
                availability: in_stock
                how_to_buy: >-
                  Open the order_url of the buyer's variant (or call create_order on the OneThing MCP
                  server with shop and options). Either returns a pay_url: give it to the buyer to pay at PayPal.
                mcp_server: https://one-thing-ash0.onrender.com/api/mcp
              schema:
                $ref: '#/components/schemas/AgentProduct'
        '404':
          description: No live shop with that link name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/mcp:
    post:
      tags: [Agents]
      operationId: callMcp
      summary: MCP server for AI shopping agents
      description: |
        A [Model Context Protocol](https://modelcontextprotocol.io) server, so agents such as
        Claude can shop here. Add `https://<host>/api/mcp` to an MCP client as a Streamable HTTP
        server. It's stateless: each POST carries one JSON-RPC 2.0 message (or a batch) and gets a
        plain JSON reply, with no session and no event stream.

        Methods: `initialize`, `ping`, `tools/list`, `tools/call`. Tools:

        | Tool | Arguments | What it does |
        |---|---|---|
        | `search_shops` | `query?`, `limit?` (1–25) | Live gallery shops whose name or headline has every word |
        | `get_product` | `shop` | The same object as `getAgentProduct` |
        | `create_order` | `shop`, `options?` | One unit on order; returns `order_id` and `pay_url` |
        | `get_order` | `order_id` | Status and `next_step`; once paid, the receipt and `delivery` |

        **The buyer always approves.** `create_order` charges nothing: the agent shows the buyer
        `pay_url` (`/o/<order_id>`, see `openPayLink`), which opens PayPal. It's a plain link on this
        site, so agent platforms that hide PayPal's checkout tokens can still show it. When the buyer
        says they've paid, the agent calls `get_order`.

        `get_order` status is one of `awaiting_buyer_approval`, `paid`, `declined` (nothing charged;
        the buyer can open `pay_url` again), `sold_out`, `expired` (call `create_order` again) or
        `failed` (PayPal couldn't be reached; try again), with a `next_step` the agent can follow.
        A paid order carries `delivery`: `{type: access_code, access_code, start_url?}`,
        `{type: download, download_url}` or `{type: shipping, ship_to, fulfillment, tracking}`, plus
        `amount` with item, shipping and total. Orders made this way show `channel: agent` in
        `listOrders`.

        Tool errors (an unknown shop, a sold-out size) come back as results with `isError: true`,
        so the model can read them and try something else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/JsonRpcRequest'
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              search:
                summary: Find a shop
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/call
                  params:
                    name: search_shops
                    arguments: { query: game }
              initialize:
                summary: Start (handshake)
                value:
                  jsonrpc: '2.0'
                  id: 0
                  method: initialize
                  params:
                    protocolVersion: '2025-06-18'
                    capabilities: {}
                    clientInfo: { name: my-agent, version: '1.0' }
              list:
                summary: List the tools
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/list
              product:
                summary: Read one product
                value:
                  jsonrpc: '2.0'
                  id: 4
                  method: tools/call
                  params:
                    name: get_product
                    arguments: { shop: vintageskates }
              order:
                summary: Order a size and colour
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/call
                  params:
                    name: create_order
                    arguments:
                      shop: trailtee
                      options: { Size: M, Color: Black }
              status:
                summary: Check an order
                value:
                  jsonrpc: '2.0'
                  id: 5
                  method: tools/call
                  params:
                    name: get_order
                    arguments: { order_id: pX4kR9tVb2nQ7sLe }
      responses:
        '200':
          description: The JSON-RPC reply (an array for a batch).
          content:
            application/json:
              examples:
                search:
                  summary: search_shops
                  value:
                    jsonrpc: '2.0'
                    id: 1
                    result:
                      content:
                      - type: text
                        text: "{\n  \"shops\": [\n    {\n      \"shop\": \"vintageskates\",\n      \"name\": \"Vintage\
                          \ Cream and Red Roller Skates\",\n      \"kind\": \"physical\",\n      \"headline\": \"Classic\
                          \ quad skates crafted with walnut burl heels\",\n      \"price\": \"$240.00\",\n      \"url\"\
                          : \"https://one-thing-ash0.onrender.com/vintageskates\"\n    },\n    {\n      \"shop\": \"raptorrush\"\
                          ,\n      \"name\": \"Raptor Rush: Browser Edition\",\n      \"kind\": \"digital\",\n      \"\
                          headline\": \"Grow from Tiny Hatchling to Giant Apex Predator\",\n      \"price\": \"$2.99\"\
                          ,\n      \"url\": \"https://one-thing-ash0.onrender.com/raptorrush\"\n    }\n  ]\n}"
                      structuredContent:
                        shops:
                        - shop: vintageskates
                          name: Vintage Cream and Red Roller Skates
                          kind: physical
                          headline: Classic quad skates crafted with walnut burl heels
                          price: $240.00
                          url: https://one-thing-ash0.onrender.com/vintageskates
                        - shop: raptorrush
                          name: 'Raptor Rush: Browser Edition'
                          kind: digital
                          headline: Grow from Tiny Hatchling to Giant Apex Predator
                          price: $2.99
                          url: https://one-thing-ash0.onrender.com/raptorrush
                      isError: false
                order:
                  summary: create_order
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    result:
                      content:
                      - type: text
                        text: "{\n  \"order_id\": \"pX4kR9tVb2nQ7sLe\",\n  \"status\": \"awaiting_buyer_approval\",\n\
                          \  \"total\": \"$255.00\",\n  \"options\": {\n    \"Size\": \"9\"\n  },\n  \"pay_url\": \"https://one-thing-ash0.onrender.com/o/pX4kR9tVb2nQ7sLe\"\
                          ,\n  \"status_url\": \"https://one-thing-ash0.onrender.com/api/agent/orders/pX4kR9tVb2nQ7sLe\"\
                          ,\n  \"next_step\": \"Show pay_url to the buyer as a link. It opens PayPal, where they pay (and\
                          \ enter a shipping address for physical items). When they say they've paid, call get_order with\
                          \ order_id: it returns the access code, download link or shipping details.\"\n}"
                      structuredContent:
                        order_id: pX4kR9tVb2nQ7sLe
                        status: awaiting_buyer_approval
                        total: $255.00
                        options:
                          Size: '9'
                        pay_url: https://one-thing-ash0.onrender.com/o/pX4kR9tVb2nQ7sLe
                        status_url: https://one-thing-ash0.onrender.com/api/agent/orders/pX4kR9tVb2nQ7sLe
                        next_step: 'Show pay_url to the buyer as a link. It opens PayPal, where they pay (and enter a
                          shipping address for physical items). When they say they''ve paid, call get_order with order_id:
                          it returns the access code, download link or shipping details.'
                      isError: false
                status:
                  summary: get_order, paid
                  value:
                    jsonrpc: '2.0'
                    id: 5
                    result:
                      content:
                      - type: text
                        text: "{\n  \"order_id\": \"pX4kR9tVb2nQ7sLe\",\n  \"status\": \"paid\",\n  \"product\": \"Vintage\
                          \ Cream and Red Roller Skates\",\n  \"options\": {\n    \"Size\": \"9\"\n  },\n  \"amount\"\
                          : {\n    \"item\": 240,\n    \"shipping\": 15,\n    \"total\": 255,\n    \"currency\": \"USD\"\
                          \n  },\n  \"total\": \"$255.00\",\n  \"paid_at\": \"2026-10-22T02:41:37Z\",\n  \"receipt_url\"\
                          : \"https://one-thing-ash0.onrender.com/vintageskates/thanks?order=pX4kR9tVb2nQ7sLe\",\n  \"\
                          delivery\": {\n    \"type\": \"shipping\",\n    \"ship_to\": {\n      \"name\": \"Sam Rivera\"\
                          ,\n      \"address\": \"1 Main St, Springfield, IL, 62701, US\"\n    },\n    \"fulfillment\"\
                          : \"to_ship\",\n    \"tracking\": null\n  }\n}"
                      structuredContent:
                        order_id: pX4kR9tVb2nQ7sLe
                        status: paid
                        product: Vintage Cream and Red Roller Skates
                        options:
                          Size: '9'
                        amount:
                          item: 240
                          shipping: 15
                          total: 255
                          currency: USD
                        total: $255.00
                        paid_at: '2026-10-22T02:41:37Z'
                        receipt_url: https://one-thing-ash0.onrender.com/vintageskates/thanks?order=pX4kR9tVb2nQ7sLe
                        delivery:
                          type: shipping
                          ship_to:
                            name: Sam Rivera
                            address: 1 Main St, Springfield, IL, 62701, US
                          fulfillment: to_ship
                          tracking: null
                      isError: false
                toolError:
                  summary: A tool error the model can read
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    result:
                      content:
                      - type: text
                        text: "{\n  \"error\": \"9 / Black is sold out.\"\n}"
                      isError: true
              schema:
                oneOf:
                  - $ref: '#/components/schemas/JsonRpcResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/JsonRpcResponse'
        '202':
          description: Only notifications were sent; there's nothing to reply.
        '400':
          description: Not JSON (JSON-RPC parse error `-32700`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'

webhooks:
  orderEvent:
    post:
      operationId: onOrderEvent
      summary: Order paid or shipped (Zapier hook)
      description: |
        If a shop sets `zapier_hook_url` (a `https://hooks.zapier.com/` Catch Hook), every paid
        and shipped order is POSTed to it. Best effort: a failing hook never affects the sale.
      requestBody:
        content:
          application/json:
            example:
              event: order.paid
              shop:
                slug: vintageskates
                name: Vintage Cream and Red Roller Skates
                url: https://one-thing-ash0.onrender.com/vintageskates
              order:
                id: pX4kR9tVb2nQ7sLe
                paypal_order_id: 5O190127TN364715T
                amount: '255.00'
                currency: USD
                buyer_name: Sam Rivera
                buyer_email: buyer@example.com
                shipping_address:
                  address_line_1: 1 Main St
                  admin_area_2: Springfield
                  admin_area_1: IL
                  postal_code: '62701'
                  country_code: US
                fulfillment_status: to_ship
                tracking_number: null
                carrier: null
            schema:
              $ref: '#/components/schemas/OrderEvent'
      responses:
        '200':
          description: Any 2xx.

components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: x-admin-token
      description: The shop's admin token, returned once by `createShop`. Keep it secret.
    PlatformKey:
      type: http
      scheme: bearer
      description: >-
        A platform API key (`ot_sk_…`) for a marketplace that makes shops for its own sellers. Made
        on the website's `/account/keys` page after Log in with PayPal, and shown once. It reaches every
        shop its account owns, so keep it on your server.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: The shop's link name (current or former).
      schema:
        type: string
        examples: [raptorrush]

  responses:
    ShopPhotos:
      description: The shop's photos, cover first.
      content:
        application/json:
          example:
            photos:
            - id: LFRvGuTU3D8i334X
              url: /api/blobs/LFRvGuTU3D8i334X
            - id: zrySajNyao6_j11x
              url: /api/blobs/zrySajNyao6_j11x
          schema:
            type: object
            required: [photos]
            properties:
              photos:
                type: array
                items:
                  type: object
                  required: [id, url]
                  properties:
                    id:
                      type: string
                    url:
                      type: string
                      description: Public image URL on this site.
    Ok:
      description: Done.
      content:
        application/json:
          example:
            ok: true
          schema:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
    BadRequest:
      description: Something in the request needs fixing; `error` says what.
      content:
        application/json:
          example:
            error: Choose a photo.
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Taken or unavailable (a link name, or a sold-out product).
      content:
        application/json:
          example:
            error: Sold out.
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such shop, or the admin token or API key doesn't match it.
      content:
        application/json:
          example:
            error: Shop not found.
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: Gemini, PayPal or Channel3 failed or isn't configured.
      content:
        application/json:
          example:
            error: PayPal isn't configured on this server.
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A sentence you can show to a person.
        field:
          type: string
          description: The form field at fault, when there is one.
        detail:
          type: string
          description: The upstream service's own message, for debugging.

    CreateShopForm:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [photo, link, channel3]
        photo:
          type: string
          format: binary
          description: '`source=photo`: the product photo, up to 8 MB.'
        description:
          type: string
          description: '`source=photo`: a sentence or two about the product. Required if there is no photo.'
        url:
          type: string
          format: uri
          description: '`source=link`: a product page, or your own app or game page.'
        productId:
          type: string
          description: '`source=channel3`: a product id from `searchProducts`.'
        slug:
          type: string
          description: The link name you want. If omitted, the AI suggests one.
        type:
          type: string
          enum: [auto, physical, digital]
          default: auto
        delivery:
          type: string
          enum: [file, access_code]
          description: For digital products. If omitted, the AI guesses.
        access_url:
          type: string
          format: uri
          description: Where buyers use an access code.
        price:
          type: number
          description: USD. If omitted, the AI suggests a price.
        shipping:
          type: number
        stock:
          type: integer
        ship_countries:
          type: string
          examples: [US,CA]
        paypal_email:
          type: string
          format: email
        seller_email:
          type: string
          format: email
        digital_file:
          type: string
          format: binary

    CreatedShop:
      type: object
      required: [slug, token, manageUrl]
      properties:
        slug:
          type: string
          examples: [dragonflight]
        token:
          type: string
          description: The admin token. Shown once; store it.
        manageUrl:
          type: string
          description: The seller's private manage page (contains the token).

    ShopUpdate:
      type: object
      properties:
        slug:
          type: string
        status:
          type: string
          enum: [draft, live]
        product_type:
          type: string
          enum: [physical, digital, referral]
          description: '`referral` only for shops created from Channel3.'
        price:
          type: number
          minimum: 0.5
          maximum: 10000
        shipping:
          type: number
          minimum: 0
          maximum: 500
        stock:
          type: [integer, 'null']
          minimum: 0
        ship_countries:
          type: [string, 'null']
        delivery:
          type: string
          enum: [file, access_code]
        access_url:
          type: [string, 'null']
          format: uri
        paypal_email:
          type: [string, 'null']
          format: email
        seller_email:
          type: [string, 'null']
          format: email
        zapier_hook_url:
          type: [string, 'null']
          format: uri
        in_gallery:
          type: boolean
          description: Feature the shop at `/gallery` while it's live. Off by default.
        options:
          type: array
          maxItems: 3
          description: >-
            What the buyer picks (physical products only), replacing the current options; `[]`
            removes them. With options, stock is counted per combination in `option_stock` and the
            shop's own `stock` is cleared. At most 60 combinations.
          items:
            $ref: '#/components/schemas/ShopOption'
        option_stock:
          $ref: '#/components/schemas/OptionStock'
        facts:
          type: array
          maxItems: 5
          description: >-
            Answers to the "buyers will ask" questions in `suggestions.missingFacts`. Each becomes a
            product detail on the page (replacing one with the same label) and drops off the list.
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
                maxLength: 30
                examples: [Size]
              value:
                type: string
                maxLength: 100
                examples: ["US women's 8"]

    Shop:
      type: object
      required: [id, slug, status, product_type, price_cents, currency, spec]
      properties:
        id:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, live]
        product_type:
          type: string
          enum: [physical, digital, referral]
        price_cents:
          type: integer
        currency:
          type: string
          examples: [USD]
        shipping_cents:
          type: integer
        ship_countries:
          type: [string, 'null']
        stock:
          type: [integer, 'null']
        delivery:
          type: string
          enum: [file, access_code]
        access_url:
          type: [string, 'null']
        paypal_email:
          type: [string, 'null']
        seller_email:
          type: [string, 'null']
        paypal_merchant_id:
          type: [string, 'null']
          description: The connected PayPal account (`connectPayPal`). Sales go here when it can receive payments.
        paypal_status:
          oneOf:
            - $ref: '#/components/schemas/PayPalStatus'
            - type: 'null'
        zapier_hook_url:
          type: [string, 'null']
        in_gallery:
          type: boolean
        account_id:
          type: [string, 'null']
          description: The seller account that owns the shop, if it was made while signed in.
        options:
          type: array
          items:
            $ref: '#/components/schemas/ShopOption'
        option_stock:
          $ref: '#/components/schemas/OptionStock'
        suggestions:
          oneOf:
            - $ref: '#/components/schemas/Suggestions'
            - type: 'null'
        photo_blob:
          type: [string, 'null']
          description: Image id for `getImage`. The cover photo.
        gallery_blobs:
          type: array
          items:
            type: string
          description: The other photos, in order.
        hero_blob:
          type: [string, 'null']
        hero_status:
          type: string
          enum: [none, pending, ready, failed]
        hero_error:
          type: [string, 'null']
        ai_source:
          type: string
          enum: [gemini, fallback]
        source_url:
          type: [string, 'null']
        referral:
          oneOf:
            - $ref: '#/components/schemas/Referral'
            - type: 'null'
        spec:
          $ref: '#/components/schemas/DesignSpec'
        created_at:
          type: string
          format: date-time

    DesignSpec:
      type: object
      description: What Gemini designed. OneThing's templates render it; Gemini never writes HTML.
      required: [productType, productName, layout, palette, fonts, headline, bullets, faq, ctaLabel]
      properties:
        productType:
          type: string
          enum: [digital, physical]
        productName:
          type: string
        layout:
          type: string
          enum: [bold-hero, editorial, minimal, playful]
        palette:
          type: object
          required: [background, surface, text, muted, accent, accentText]
          properties:
            background: { $ref: '#/components/schemas/HexColor' }
            surface: { $ref: '#/components/schemas/HexColor' }
            text: { $ref: '#/components/schemas/HexColor' }
            muted: { $ref: '#/components/schemas/HexColor' }
            accent: { $ref: '#/components/schemas/HexColor' }
            accentText: { $ref: '#/components/schemas/HexColor' }
        fonts:
          type: object
          required: [heading, body]
          properties:
            heading:
              type: string
            body:
              type: string
        eyebrow:
          type: string
        headline:
          type: string
        subheadline:
          type: string
        story:
          type: string
        bullets:
          type: array
          items:
            type: string
        details:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
              value:
                type: string
        faq:
          type: array
          items:
            type: object
            required: [q, a]
            properties:
              q:
                type: string
              a:
                type: string
        ctaLabel:
          type: string
        suggestedPriceUsd:
          type: number
        suggestedShippingUsd:
          type: number
        imageAlt:
          type: string
        heroPrompt:
          type: string

    HexColor:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
      examples: ['#14171a']

    ShopOption:
      type: object
      description: Something the buyer picks, such as a size or a colour. The shop still sells one product.
      required: [name, kind, values]
      properties:
        name:
          type: string
          maxLength: 20
          examples: [Size]
        kind:
          type: string
          enum: [size, color, other]
          description: '`color` shows swatches, and the photo of the picked colour.'
        values:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/OptionValue'

    OptionValue:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 30
          examples: [M]
        hex:
          $ref: '#/components/schemas/HexColor'
        photo:
          type: string
          description: 'Colours: the shop photo (id) that shows this colour. See `matchColorPhotos`.'

    Choice:
      type: object
      description: The buyer's pick, one value per option, keyed by option name.
      additionalProperties:
        type: string
      examples:
        - { Size: M, Color: Black }

    OptionStock:
      type: object
      description: >-
        Stock per combination, keyed by its values in option order joined with ` / ` (e.g. `M / Black`).
        A missing key or `null` means unlimited; `0` is sold out.
      additionalProperties:
        type: [integer, 'null']
        minimum: 0
      examples:
        - { M / Black: 4, L / Black: 0 }

    Suggestions:
      type: object
      description: What Gemini thinks buyers will want to choose or ask. The seller confirms; nothing is applied on its own.
      required: [oneOfAKind, options, missingFacts]
      properties:
        oneOfAKind:
          type: boolean
          description: A single item (vintage, handmade), so options and stock don't apply.
        options:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ShopOption'
              - type: object
                properties:
                  fromSeller:
                    type: boolean
                    description: The seller's description or photo named these values; otherwise they're a guess.
        missingFacts:
          type: array
          items:
            type: object
            required: [label, question, placeholder]
            properties:
              label:
                type: string
                examples: [Size]
              question:
                type: string
                examples: ['What size are the skates?']
              placeholder:
                type: string
                examples: ["US women's 8"]

    PayPalStatus:
      type: object
      description: What PayPal last said about a connected seller account.
      required: [receivable, emailConfirmed, checkedAt]
      properties:
        receivable:
          type: boolean
          description: The account can receive payments.
        emailConfirmed:
          type: boolean
          description: The seller has confirmed their email with PayPal.
        checkedAt:
          type: string
          format: date-time

    AgentProduct:
      type: object
      description: A live shop as an AI agent sees it. Recommendations have `offers`; everything else has `price` and is bought with `create_order`.
      required: [shop, url, name, kind, headline, description, highlights, details, faq, images, how_to_buy]
      properties:
        shop:
          type: string
          description: The link name, which the MCP tools take as `shop`.
        url:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [physical, digital, referral]
        headline:
          type: string
        description:
          type: string
        highlights:
          type: array
          items:
            type: string
        details:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
              value:
                type: string
        faq:
          type: array
          items:
            type: object
            required: [q, a]
            properties:
              q:
                type: string
              a:
                type: string
        images:
          type: array
          items:
            type: string
        price:
          $ref: '#/components/schemas/AgentMoney'
        shipping:
          description: Physical products only.
          oneOf:
            - type: object
              required: [amount, currency, ships_to]
              properties:
                amount:
                  type: number
                currency:
                  type: string
                ships_to:
                  type: array
                  items:
                    type: string
                  description: Country codes; empty means anywhere PayPal ships.
            - type: 'null'
        total:
          $ref: '#/components/schemas/AgentMoney'
        delivery:
          type: string
          examples: ['Shipped. PayPal collects the buyer''s address at checkout.']
        availability:
          type: string
          examples: [in_stock, 'in_stock (3 left)', sold_out]
        options:
          type: array
          description: Pass one value per option to `create_order`.
          items:
            type: object
            required: [name, values]
            properties:
              name:
                type: string
              values:
                type: array
                items:
                  type: string
        variants:
          type: array
          items:
            type: object
            required: [choice, availability]
            properties:
              choice:
                $ref: '#/components/schemas/Choice'
              availability:
                type: string
              order_url:
                type: string
                description: '`orderByLink` for this pick. Left out when it''s sold out.'
        order_url:
          type: string
          description: >-
            Products without options: `orderByLink`, which orders one unit with a GET. Left out
            when sold out. With options, each variant has its own.
        offers:
          type: array
          description: Recommendations only. Bought at the retailer.
          items:
            type: object
            required: [retailer, price, currency, in_stock, url]
            properties:
              retailer:
                type: string
              price:
                type: number
              currency:
                type: string
              in_stock:
                type: boolean
              url:
                type: string
        how_to_buy:
          type: string
        mcp_server:
          type: string
          description: The MCP server to order through (`getAgentProduct` only).

    AgentShopSummary:
      type: object
      required: [shop, name, kind, headline, price, url]
      properties:
        shop:
          type: string
          description: The link name, for `getAgentProduct` and the MCP tools.
        name:
          type: string
        kind:
          type: string
          enum: [physical, digital, referral]
        headline:
          type: string
        price:
          type: [string, 'null']
          description: The price label, e.g. `$2.99`; null for recommendations.
        url:
          type: string
          description: The shop page.

    AgentCreatedOrder:
      type: object
      description: A new order, as `create_order` and `orderByLink` return it.
      required: [order_id, status, total, pay_url, status_url, next_step]
      properties:
        order_id:
          type: string
        status:
          type: string
          const: awaiting_buyer_approval
        total:
          type: string
          description: The total with shipping, as a label.
        options:
          $ref: '#/components/schemas/Choice'
        pay_url:
          type: string
          description: Where the buyer pays (redirects to PayPal). Safe to show in chat.
        status_url:
          type: string
          description: '`getAgentOrder` for this order.'
        next_step:
          type: string

    AgentOrder:
      type: object
      description: An order as `get_order` and `getAgentOrder` report it.
      required: [order_id, status, product, amount, total]
      properties:
        order_id:
          type: string
        status:
          type: string
          enum: [awaiting_buyer_approval, paid, declined, sold_out, expired, failed]
          description: >-
            `declined`: PayPal declined it, nothing charged, the buyer can open `pay_url` again.
            `sold_out`: it sold out before the payment was captured. `expired`: the PayPal checkout
            expired; create a new order. `failed`: PayPal couldn't be reached; ask again.
        product:
          type: string
        options:
          $ref: '#/components/schemas/Choice'
        amount:
          type: object
          required: [item, shipping, total, currency]
          properties:
            item:
              type: number
            shipping:
              type: number
            total:
              type: number
            currency:
              type: string
        total:
          type: string
          description: The total as a label, e.g. `$255.00`.
        pay_url:
          type: string
          description: Unpaid orders (waiting or declined). The buyer pays here; safe to show in chat.
        next_step:
          type: string
          description: Unpaid orders. What the agent should do next, in plain words.
        paid_at:
          type: string
          format: date-time
        receipt_url:
          type: string
          description: Paid orders. The buyer's thank-you page.
        delivery:
          description: Paid orders. What the buyer got.
          oneOf:
            - $ref: '#/components/schemas/AgentDeliveryAccessCode'
            - $ref: '#/components/schemas/AgentDeliveryDownload'
            - $ref: '#/components/schemas/AgentDeliveryShipping'

    AgentDeliveryAccessCode:
      type: object
      description: A digital product unlocked with an access code.
      required: [type, access_code]
      properties:
        type:
          type: string
          const: access_code
        access_code:
          type: string
        start_url:
          type: string
          description: The seller's app with the code filled in.

    AgentDeliveryDownload:
      type: object
      description: A digital file to download.
      required: [type, download_url]
      properties:
        type:
          type: string
          const: download
        download_url:
          type: string
        note:
          type: string

    AgentDeliveryShipping:
      type: object
      description: A physical product shipped to the buyer.
      required: [type, fulfillment]
      properties:
        type:
          type: string
          const: shipping
        ship_to:
          type: [object, 'null']
          properties:
            name:
              type: [string, 'null']
            address:
              type: string
        fulfillment:
          type: string
          enum: [to_ship, shipped]
        tracking:
          type: [object, 'null']
          properties:
            carrier:
              type: string
            number:
              type: string

    PlatformShop:
      type: object
      required: [slug, status, name, product_type, price, url, paypal_connected, sales, created_at]
      properties:
        slug:
          type: string
        status:
          type: string
          enum: [draft, live]
        name:
          type: string
        headline:
          type: string
        product_type:
          type: string
          enum: [physical, digital, referral]
        price:
          $ref: '#/components/schemas/AgentMoney'
        url:
          type: string
          description: The shop page buyers pay on.
        cover:
          type: [string, 'null']
          description: The cover image's URL.
        paypal_connected:
          type: boolean
          description: The seller connected a PayPal account that can be paid.
        sales:
          type: integer
          description: Paid orders.
        created_at:
          type: string
          format: date-time

    AgentMoney:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          examples: [48.5]
        currency:
          type: string
          examples: [USD]
        label:
          type: string
          examples: ['$48.50']

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          description: Leave out for a notification.
          type: [string, integer, 'null']
        method:
          type: string
          enum: [initialize, ping, tools/list, tools/call, notifications/initialized]
        params:
          type: object
          description: 'For `tools/call`: `{ name, arguments }`.'
          additionalProperties: true

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type: [string, integer, 'null']
        result:
          type: object
          description: >-
            For `tools/call`: `content` (the answer as JSON text), `structuredContent` (the same
            object) and `isError`.
          additionalProperties: true
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              examples: [-32601]
            message:
              type: string

    Referral:
      type: object
      description: A recommended Channel3 product. Buy links are Channel3-tracked, credited to this shop.
      required: [productId, title, offers]
      properties:
        productId:
          type: string
        title:
          type: string
        brand:
          type: [string, 'null']
        image:
          type: [string, 'null']
        offers:
          type: array
          items:
            type: object
            required: [domain, url, price, currency, inStock, commission]
            properties:
              domain:
                type: string
              url:
                type: string
              price:
                type: number
              currency:
                type: string
              inStock:
                type: boolean
              commission:
                type: number
                description: Maximum commission rate, 0–1 (0.08 = 8%).

    ProductCard:
      type: object
      required: [id, title, image, price, currency, retailer, retailers, commission]
      properties:
        id:
          type: string
        title:
          type: string
        brand:
          type: [string, 'null']
        image:
          type: string
        price:
          type: number
        currency:
          type: string
        retailer:
          type: string
          description: The store with the best offer.
        retailers:
          type: integer
        commission:
          type: number
          description: Best commission rate across offers, 0–1.

    Order:
      type: object
      required: [id, status, amount_cents, currency, fulfillment_status]
      properties:
        id:
          type: string
        paypal_order_id:
          type: [string, 'null']
        status:
          type: string
          enum: [created, paid, failed]
        amount_cents:
          type: integer
        shipping_cents:
          type: integer
        currency:
          type: string
        buyer_email:
          type: [string, 'null']
        buyer_name:
          type: [string, 'null']
        shipping_address:
          type: [object, 'null']
          additionalProperties:
            type: string
        capture_id:
          type: [string, 'null']
        fulfillment_status:
          type: string
          enum: [none, to_ship, shipped, digital_sent]
        carrier:
          type: [string, 'null']
        tracking_number:
          type: [string, 'null']
        tracking_synced:
          type: boolean
        downloads:
          type: integer
        access_code:
          type: [string, 'null']
        code_uses:
          type: integer
        channel:
          type: string
          enum: [web, agent]
          description: '`agent` for orders an AI agent placed through the MCP server.'
        options:
          type: [object, 'null']
          description: The buyer's pick, one value per option, keyed by option name (see `Choice`).
          additionalProperties:
            type: string
        paid_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    WebhookEvent:
      type: object
      required: [id, event_type, verified, outcome, received_at]
      properties:
        id:
          type: string
          description: PayPal's event id.
        event_type:
          type: string
          examples: [PAYMENT.CAPTURE.COMPLETED]
        paypal_order_id:
          type: [string, 'null']
        summary:
          type: [string, 'null']
          examples: [2.99 USD]
        verified:
          type: boolean
          description: Whether PayPal confirmed the delivery's signature.
        outcome:
          type: string
          examples: ['Confirmed: order already paid']
        received_at:
          type: string
          format: date-time

    OrderEvent:
      type: object
      required: [event, shop, order]
      properties:
        event:
          type: string
          enum: [order.paid, order.shipped]
        shop:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
            url:
              type: string
        order:
          type: object
          properties:
            id:
              type: string
            paypal_order_id:
              type: [string, 'null']
            amount:
              type: string
              examples: ['2.99']
            currency:
              type: string
            buyer_name:
              type: [string, 'null']
            buyer_email:
              type: [string, 'null']
            shipping_address:
              type: [object, 'null']
            fulfillment_status:
              type: string
            tracking_number:
              type: [string, 'null']
            carrier:
              type: [string, 'null']
